<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EL Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --border:#dde1e7;
  --text:#1b1e24; --text-muted:#5c6270; --text-faint:#8b8fa0;
  --brand:#2f5d8a; --brand-dark:#1f4467; --brand-tint:#e7f0f8;
  --success:#3f6b58; --success-bg:#e6f0ea; --success-border:#bcd9c9;
  --warning:#9a5b1f; --warning-bg:#faeee0; --warning-border:#eecda3;
  --danger:#a82a20; --danger-bg:#fbe8e6; --danger-border:#f0c1bc;
  --info:#2f5d8a; --info-bg:#e7f0f8; --info-border:#c7d9ea;
  --gold:#c9a13b; --navy:#152742;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(20,20,30,.05), 0 2px 10px rgba(20,20,30,.05);
  --font: 'Public Sans', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;
}
html[data-theme="dark"]{
  --bg:#111319; --surface:#181b22; --surface-2:#1f232c; --border:#2b3038;
  --text:#e7e9ee; --text-muted:#a7acb9; --text-faint:#767c8a;
  --brand:#7fb0e6; --brand-dark:#9cc2ee; --brand-tint:#1c2c3d;
  --success:#7fb89e; --success-bg:#16281f; --success-border:#284436;
  --warning:#d9a568; --warning-bg:#332210; --warning-border:#54371a;
  --danger:#f2938a; --danger-bg:#3a1917; --danger-border:#5c2b26;
  --info:#7fb0e6; --info-bg:#1c2c3d; --info-border:#2d4258;
  --gold:#d8b967; --navy:#9fb4d4;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
h1,h2{font-family:var(--font-serif);font-weight:600;letter-spacing:-0.01em;}
a{color:var(--brand);text-decoration:none;cursor:pointer;}
a:hover{text-decoration:underline;}
button{font-family:inherit;font-size:13px;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
.hidden{display:none !important;}

#shell{display:flex;min-height:100vh;}
#sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
#sidebar .brand{padding:18px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
#sidebar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);}
#navlist{padding:10px;flex:1;overflow-y:auto;}
#navlist .navitem{display:block;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-muted);font-size:13px;margin-bottom:2px;}
#navlist .navitem:hover{background:var(--surface-2);text-decoration:none;color:var(--text);}
#navlist .navitem.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600;}
#navlist .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin:14px 10px 4px;}
#navlist .subitem{padding-left:22px;font-size:12.5px;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
#topbar .spacer{flex:1;}
#content{padding:22px;max-width:1180px;width:100%;margin:0 auto;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.pagehead h1{font-size:20px;margin:0 0 4px;}
.crumb{font-size:12px;color:var(--text-faint);margin-bottom:6px;}
.crumb a{color:var(--text-faint);}
.pagesub{color:var(--text-muted);font-size:13px;margin:0;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.card h2,.card h3{margin-top:0;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;} #sidebar{width:64px;} #sidebar .navlabel{display:none;} #sidebar .brand span{display:none;}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;}
.btn:hover{background:var(--surface-2);text-decoration:none;}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-sm{padding:4px 9px;font-size:12px;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;}
.badge-success{background:var(--success-bg);color:var(--success);border-color:var(--success-border);}
.badge-warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border);}
.badge-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
.badge-info{background:var(--info-bg);color:var(--info);border-color:var(--info-border);}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);border-color:var(--border);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;}
.pill-blue{background:var(--info-bg);color:var(--info);}
.pill-green{background:var(--success-bg);color:var(--success);}
.pill-orange{background:var(--warning-bg);color:var(--warning);}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table tr:last-child td{border-bottom:none;}
table tr.clickable:hover{background:var(--surface-2);cursor:pointer;}
.tablewrap{overflow-x:auto;}

.field{margin-bottom:12px;}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px;}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.field input[type=text],.field input[type=email],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
.field .errmsg{color:var(--danger);font-size:11.5px;margin-top:3px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}

.empty{text-align:center;padding:34px 20px;color:var(--text-muted);}
.empty .emoji{font-size:26px;margin-bottom:8px;}
.empty p{margin:0 0 12px;}

.progressbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.progressbar > div{height:100%;background:var(--brand);}

.callout{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
.callout-info{background:var(--info-bg);border-color:var(--info-border);color:var(--info);}
.callout-warning{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning);}
.callout-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger);}
.callout-success{background:var(--success-bg);border-color:var(--success-border);color:var(--success);}
.callout a{font-weight:600;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tabs .tab{padding:9px 14px;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
.tabs .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
.tabs .tab:hover{color:var(--text);text-decoration:none;}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{margin:0;font-size:15px;}
.modal-body{padding:18px;}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-faint);}

#toastRoot{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13px;max-width:340px;animation:toastin .18s ease-out;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.impersonation-banner{background:var(--warning);color:#241a00;padding:8px 20px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.impersonation-banner button{background:rgba(0,0,0,.15);border:none;color:inherit;padding:4px 10px;border-radius:var(--radius-sm);font-weight:600;}

.notif-item{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:var(--brand-tint);border-radius:var(--radius-sm);}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:6px;flex-shrink:0;}
.notif-dot.read{background:transparent;}

.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px;}
.kv dt{color:var(--text-faint);}
.kv dd{margin:0;}

.searchbox{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;min-width:220px;}
.searchbox input{border:none;background:transparent;flex:1;outline:none;color:var(--text);}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.stat .num{font-size:28px;font-weight:700;}
.stat .lbl{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}

.seatbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}

.iconbtn{background:none;border:none;font-size:16px;color:var(--text-muted);padding:4px 6px;border-radius:var(--radius-sm);}
.iconbtn:hover{background:var(--surface-2);}

.role-pill{font-size:11px;background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:99px;color:var(--text-muted);}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);font-size:12px;}
.mt0{margin-top:0;}
.mb0{margin-bottom:0;}
.divider{border-top:1px solid var(--border);margin:14px 0;}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);margin-right:4px;margin-bottom:4px;}
.tag-urgent{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border);}
.tag-followup{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border);}
.tag-review{background:var(--info-bg);color:var(--info);border-color:var(--info-border);}
.tag-blue{background:var(--info-bg);color:var(--info);border-color:var(--info-border);}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--info-bg);color:var(--info);margin-right:4px;margin-bottom:4px;}

/* Chart primitives */
.chartcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.donut{position:relative;width:150px;height:150px;border-radius:50%;}
.donut .donutlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);justify-content:center;}
.legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle;}
.stackbar{height:220px;display:flex;align-items:flex-end;gap:40px;justify-content:center;padding:10px 0;}
.stackbar .barcol{width:70px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;}
.stackbar .barseg{width:100%;}
.stackbar .barlabels{display:flex;gap:40px;justify-content:center;font-size:12px;color:var(--text-muted);margin-top:6px;}

/* Drawer */
#drawerRoot{position:fixed;inset:0;z-index:150;pointer-events:none;}
.drawer-backdrop{position:absolute;inset:0;background:rgba(10,12,18,.4);opacity:0;transition:opacity .2s;pointer-events:none;}
.drawer-backdrop.show{opacity:1;pointer-events:auto;}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(760px,92vw);background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .22s ease;pointer-events:auto;overflow-y:auto;}
.drawer-panel.show{transform:translateX(0);}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.drawer-body{padding:20px 24px;}
</style>
</head>

  </div>
</div>

<div id="drawerRoot"></div>
<div id="toastRoot"></div>

function learnerComplianceStatus(learnerId){
  var recs = COMPLIANCE.filter(function(c){return c.learnerId===learnerId;});
  if(recs.some(function(r){return r.status==='Non-Compliant';})) return 'Non-Compliant';
  if(recs.some(function(r){return r.status==='Pending Compliance';})) return 'Pending Compliance';
  return 'Compliant';
}
function learnerCompliancePct(learnerId){
  var recs = COMPLIANCE.filter(function(c){return c.learnerId===learnerId;});
  var done = recs.filter(function(r){return r.status==='Compliant';}).length;
  return Math.round(100*done/recs.length);
}
function unreadCount(role,userId){

function badge(status){
  var map = {
    'Compliant':'success','On Time':'success','All Clear':'success','Published':'success','Approved':'success','Completed':'success','Accepted':'success','ok':'success','Available':'success','Active':'success','scheduled':'success',
    'Pending Compliance':'warning','Behind':'warning','Pending Validation':'warning','Draft':'warning','warning':'warning','Partial':'warning','Pending':'warning','Proposed':'warning',
    'Non-Compliant':'danger','Overdue':'danger','critical':'danger','Rejected':'danger','Limited':'danger','Inactive':'danger','Unpublished':'danger','closed':'danger',
    'Scheduled':'info','In Review':'info','Claimed':'info','Unclaimed':'neutral','Open':'info','Waitlisted':'info','open':'success'

function tableHtml(headers, rows, opts){
  opts = opts || {};
  if(!rows.length){
    return emptyState(opts.emptyMessage || 'No records found.', opts.emptyActionLabel, opts.emptyActionOnclick, opts.emptyEmoji);
  }
  var h = '<div class="tablewrap"><table><thead><tr>';
  headers.forEach(function(hd){ h+='<th>'+esc(hd)+'</th>'; });
  h+='</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr'+(row.onclick? ' class="clickable" onclick="'+row.onclick+'"':'')+'>';
    row.cells.forEach(function(c){ h+='<td>'+c+'</td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

/* ---- Chart helpers (pure CSS conic-gradient donuts + flex stacked bars, no libraries) ---- */
var CHART_COLORS = ['#2f5d8a','#c9a13b','#8b909b','#a82a20','#1e7e46'];
function donutChart(title, segments, filterId){
  // segments: [{label, value, color}]
  var total = segments.reduce(function(s,x){return s+x.value;},0) || 1;
  var acc = 0;
  var stops = segments.map(function(s){
    var start = 100*acc/total; acc+=s.value; var end = 100*acc/total;
    return s.color+' '+start.toFixed(1)+'% '+end.toFixed(1)+'%';
  }).join(', ');
  var legend = segments.map(function(s){ return '<span><span class="dot" style="background:'+s.color+'"></span>'+esc(s.label)+'</span>'; }).join('');
  return '<div class="chartcard"><div class="card-title-row"><h3 class="mt0 mb0">'+esc(title)+'</h3>'+
    (filterId? '<select class="chartfilter" style="font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);"><option>All</option></select>':'')+
    '</div><div class="donutwrap"><div class="donut" style="background:conic-gradient('+stops+');"><div class="donutlabel">'+total+' total</div></div>'+
    '<div class="legend">'+legend+'</div></div></div>';
}
function stackedBarChart(title, cols, filterId){
  // cols: [{label, segments:[{label,value,color}]}]
  var maxTotal = Math.max.apply(null, cols.map(function(c){ return c.segments.reduce(function(s,x){return s+x.value;},0); })) || 1;
  var bars = cols.map(function(c){
    var total = c.segments.reduce(function(s,x){return s+x.value;},0);
    var heightPct = 100*total/maxTotal;
    var segsHtml = c.segments.map(function(s){
      var segPct = total? 100*s.value/total : 0;
      return '<div class="barseg" style="height:'+segPct+'%;background:'+s.color+';"></div>';
    }).join('');
    return '<div class="barcol" style="height:'+heightPct+'%;">'+segsHtml+'</div>';
  }).join('');
  var labels = cols.map(function(c){ return '<span>'+esc(c.label)+'</span>'; }).join('');
  var allSegLabels = {};
  cols.forEach(function(c){ c.segments.forEach(function(s){ allSegLabels[s.label]=s.color; }); });
  var legend = Object.keys(allSegLabels).map(function(l){ return '<span><span class="dot" style="background:'+allSegLabels[l]+'"></span>'+esc(l)+'</span>'; }).join('');
  return '<div class="chartcard"><div class="card-title-row"><h3 class="mt0 mb0">'+esc(title)+'</h3>'+
    (filterId? '<select style="font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);"><option>All</option></select>':'')+
    '</div><div class="stackbar">'+bars+'</div><div class="barlabels">'+labels+'</div><div class="legend" style="margin-top:8px;">'+legend+'</div></div>';
}

var ROLE_PREFIX = { 'Learner':'#/learner', 'Faculty':'#/faculty', 'Coordinator':'#/coordinator', 'Specialist':'#/specialist', 'Admin':'#/admin', 'Super Admin':'#/superadmin' };
var GLOBAL_PREFIXES = ['#/notifications','#/profile','#/calendar','#/search','#/about','#/noaccess'];

function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  renderSidebar(); renderTopbar(); renderImpersonationBanner();
  var route = state.route || defaultRouteForRole();
  var isGlobal = GLOBAL_PREFIXES.some(function(p){ return route.indexOf(p)===0; });
  var role = activeRole();
  var content = '';
  if(isGlobal){
    content = renderGlobalRoute(route);
  } else {
    var allowedPrefix = ROLE_PREFIX[role];
    var okPrefixes = [allowedPrefix];
    if(role==='Super Admin') okPrefixes.push('#/admin');
    var matched = okPrefixes.some(function(p){ return route.indexOf(p)===0; });
    content = matched ? dispatchRoleRoute(role, route) : renderNoAccess();
  }
  document.getElementById('content').innerHTML = content;
  window.scrollTo(0,0);
}
function renderNoAccess(){
  return card('<div class="empty"><div class="emoji">'+ic("lock")+'</div><h3>You don\u2019t have access to this area.</h3>'+
    '<button class="btn btn-primary btn-sm" onclick="App.goDashboard()">Back to dashboard</button></div>');
}

/* ============================== GLOBAL ROUTES ============================== */
function renderGlobalRoute(route){
  if(route.indexOf('#/about')===0) return screenAbout();
  if(route.indexOf('#/notifications')===0) return screenNotifications();
  if(route.indexOf('#/profile')===0) return screenProfile();
  if(route.indexOf('#/calendar')===0) return screenCalendar();
  if(route.indexOf('#/search')===0) return screenGlobalSearch();
  return renderNoAccess();
}

    '<h3>2. Backend</h3><p>Simulated by JavaScript service functions (register, swap, claim, approve, assign, generate) that enforce the business rules below \u2014 there is no real server.</p>'+
    '<h3>3. Databases</h3><p>A single shared in-memory JavaScript object: Learners, Faculty, Users, Roles, Sites, SOFEs, Rotations, VCBC Sessions & Slots, Practicum records, Compliance Records, Tasks, Notifications, Reports, and an Audit Log. Refreshing the page resets all data.</p>'+
    '<h3>4. Authentication</h3><p>A simulated login screen assigns you a role and account. Impersonation is a separate, permission-gated "View as" flow.</p>'+
    '<h3>5. Payments</h3><p>Not applicable. EL Portal\u2019s scope is class facilitation (VCBC, DFC, practicum) \u2014 no payment flow is built.</p>'+

    '<h3>7. Deployment</h3><p>One self-contained HTML file with vanilla JavaScript \u2014 no build step, no external network calls, no dependencies.</p>');
}

/* ============================== ROLE DISPATCH ============================== */
function dispatchRoleRoute(role, route){
  var parts = route.replace(/^#\//,'').split('/');
  switch(role){
    case 'Learner': return dispatchLearner(parts, route);
    case 'Faculty': return dispatchFaculty(parts, route);
    case 'Coordinator': return dispatchCoordinator(parts, route);
    case 'Specialist': return dispatchSpecialist(parts, route);
    case 'Admin': return dispatchAdmin(parts, route);
    case 'Super Admin': return dispatchSuperAdmin(parts, route);
  }
  return renderNoAccess();
}

/* ============================== LEARNER ============================== */
function dispatchLearner(p, route){
  var lid = state.impersonating ? state.impersonating.id : state.learnerId;
  if(p[1]==='dashboard' || p.length<2) return learnerDashboard(lid);
  if(p[1]==='vcbc' && p[2]==='reschedule' && p[3]) return learnerReschedule(lid, p[3]);
  if(p[1]==='vcbc') return learnerVcbcMarketplace(lid, p[2]);
  if(p[1]==='my-vcbc') return learnerMyVcbcPage(lid, p[2]);
  if(p[1]==='rotations') return learnerRotations(lid);
  if(p[1]==='tasks') return learnerTasks(lid, p[2]);
  if(p[1]==='compliance' && p[2]==='history') return learnerComplianceHistory(lid);
  if(p[1]==='compliance' && p[2]==='upload' && p[3]) return learnerComplianceUpload(lid, p[3]);
  if(p[1]==='compliance') return learnerCompliance(lid);
  if(p[1]==='practicum' && p[2]==='propose') return learnerSiteProposal(lid);
  if(p[1]==='practicum' && p[2] && p[3]==='respond') return learnerPlacementRespond(lid,p[2]);
  if(p[1]==='practicum') return learnerPracticum(lid);
  if(p[1]==='info' && p[2]) return infoArticleDetail(p[2], '#/learner/info');
  if(p[1]==='info') return infoCenterList('#/learner/info');
  return renderNoAccess();
}

function whatsNextLearner(lid){
  var items = [];
  var comp = learnerComplianceStatus(lid);
  if(comp!=='Compliant') items.push({label:'Resolve your compliance requirements', link:"App.go('#/learner/compliance')"});
  var overdue = LEARNER_TASKS.filter(function(t){return t.assigneeId===lid && t.status==='Overdue';});
  overdue.forEach(function(t){ items.push({label:'Overdue: '+t.title, link:"App.go('#/learner/tasks')"}); });
  if(!items.length) items.push({label:'You\u2019re all caught up. Browse upcoming VCBC sessions.', link:"App.go('#/learner/vcbc/available')"});
  return items;
}

    items.map(function(i){ return '<div style="padding:8px 0;border-bottom:1px solid var(--border);"><a onclick="'+i.link+'">'+esc(i.label)+' \u2192</a></div>'; }).join(''));

function learnerDashboard(lid){
  var l = getLearner(lid);
  var compPct = learnerCompliancePct(lid);
  var myRotations = ROTATIONS.filter(function(r){return r.assignedLearnerIds.indexOf(lid)>-1;});
  var mySlots = VCBC_SLOTS.filter(function(s){return s.registeredLearnerIds.indexOf(lid)>-1;});
  return '<div class="pagehead"><div><h1>Welcome, '+esc(l.name.split(' ')[0])+'</h1><p class="pagesub">'+esc(l.program)+'</p></div></div>'+
    whatsNextPanel(whatsNextLearner(lid))+

    card('<div class="stat"><div class="num">'+compPct+'%</div><div class="lbl">Compliance complete</div></div>')+
    card('<div class="stat"><div class="num">'+mySlots.length+'</div><div class="lbl">Upcoming VCBC sessions</div></div>')+
    card('<div class="stat"><div class="num">'+myRotations.length+'</div><div class="lbl">Active rotations</div></div>')+

function slotSeatInfo(s){
  var seats = s.registeredLearnerIds.length; var pct = Math.round(100*seats/s.capacity);
  return '<div class="seatbar">'+progressBar(pct)+'<span>'+(s.capacity-seats)+' available</span></div>';

function slotDeadline(slot){
  var start = new Date(slot.date+'T'+(slot.time||'00:00')+':00');
  return new Date(start.getTime() - SWAP_BUSINESS_RULES.swap_deadline_hours*3600000);
}
function slotDeadlinePassed(slot){ return new Date() > slotDeadline(slot); }
function fmtDeadline(slot){
  var d = slotDeadline(slot);
  return pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear()+' at '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function slotStatusInfo(slot){
  var seats = slot.registeredLearnerIds.length;
  if(seats>=slot.capacity) return {label:'Full', cls:'badge-danger'};
  if(seats/slot.capacity>=0.85) return {label:'Limited', cls:'badge-warning'};
  return {label:'Available', cls:'badge-success'};
}
function slotTagChips(slot){
  var h = slot.id.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0);
  var tags = [];
  if(h%3!==0) tags.push('Auto');
  if(h%2===0) tags.push('Preferred Time');
  return tags;
}
function computeConflicts(lid, slot){
  var sess = getSession(slot.sessionId);
  var conflicts = [];
  var mine = VCBC_SLOTS.filter(function(s){return s.registeredLearnerIds.indexOf(lid)>-1;});
  var timeConflict = mine.find(function(s){return s.date===slot.date && s.time===slot.time;});
  if(timeConflict){ var ts=getSession(timeConflict.sessionId); conflicts.push('Time conflict with '+ts.name); }
  var dup = mine.find(function(s){return getSession(s.sessionId).subjectCode===sess.subjectCode;});
  if(dup) conflicts.push('You are already registered for '+sess.subjectCode);
  var weekCount = mine.filter(function(s){return getSession(s.sessionId).week===sess.week;}).length;
  if(weekCount>=2) conflicts.push('You already have 2 sessions scheduled for Week '+sess.week);
  return conflicts;
}

function learnerVcbcMarketplace(lid, tab){
  tab = tab || 'my-schedule';
  var mySlots = VCBC_SLOTS.filter(function(s){return s.registeredLearnerIds.indexOf(lid)>-1;});
  var availableSlots = VCBC_SLOTS.filter(function(s){ var sess=getSession(s.sessionId); return s.facultyId && sess.status==='open' && !sess.registrationOpensAt && s.registeredLearnerIds.indexOf(lid)===-1; });
  var offers = SWAP_POOL.filter(function(o){return o.status==='open' && o.learnerId!==lid;});
  var tabDefs = [
    ['my-schedule','My Schedule', mySlots.length],
    ['available','Available Sessions', availableSlots.length],
    ['swap','Swap Marketplace', offers.length],
    ['insights','AI Insights', 4]
  ];
  var tabsHtml = '<div style="display:flex;gap:4px;background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:18px;overflow-x:auto;">'+
    tabDefs.map(function(t){ return '<button class="btn btn-sm '+(tab===t[0]?'btn-primary':'btn-ghost')+'" style="flex:1;justify-content:center;white-space:nowrap;" onclick="App.go(\'#/learner/vcbc/'+t[0]+'\')">'+t[1]+' <span style="opacity:.7;">&nbsp;'+t[2]+'</span></button>'; }).join('')+

  var rows = mySlots.slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(s){
    var sess = getSession(s.sessionId); var fac = getFaculty(s.facultyId);

      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><h3 class="mt0 mb0" style="font-size:15px;">'+esc(sess.name)+'</h3><span class="chip">'+esc(sess.subjectCode)+'</span>'+statusBadge+'</div>'+
      '<div class="faint" style="margin:8px 0 6px;">'+fmtDate(s.date)+' \u2022 '+s.time+' ('+120+'m) \u2022 '+(fac?esc(fac.name.split(',')[0]):'\u2014')+'</div>'+

      '<button class="btn btn-sm" onclick="App.openSessionDetails(\''+s.id+'\')">Details</button>'+actionBtn+
      '</div></div>');

      '<div class="faint" style="margin-bottom:2px;">'+s.time+' (120m)</div>'+

function renderSwapPanel(lid, slotId, method){
  method = method || 'open-slot';

  var body = '';
  if(method==='open-slot'){
    var alternatives = VCBC_SLOTS.filter(function(x){return x.id!==slotId && x.facultyId && x.registeredLearnerIds.length<x.capacity && !getSession(x.sessionId).registrationOpensAt;}).slice(0,6);
    body = '<p class="faint" style="margin-top:-6px;">Choose from available sessions. Your swap is immediate.</p>'+

      (alternatives.length? '' : emptyState('No open slots available right now.'))+
      '<input type="hidden" id="swapPanelSelectedSlot" value=""/>';
  } else if(method==='post-swap'){
    body = '<p class="faint" style="margin-top:-6px;">List this slot in the swap marketplace for another learner to trade with you.</p>'+
      '<div class="field"><label>Reason (optional)</label><textarea id="swapPanelReason" rows="3" placeholder="Why are you looking to swap?"></textarea></div>';
  } else if(method==='direct'){
    body = '<p class="faint" style="margin-top:-6px;">Send a direct swap request to a specific learner by email.</p>'+
      '<div class="field"><label>Learner email</label><input type="text" id="swapPanelEmail" placeholder="learner@learn.nightingale.edu"/></div>'+
      '<div class="field"><label>Message</label><textarea id="swapPanelReason" rows="3" placeholder="Explain your swap request..."></textarea></div>';
  } else {
    body = '<p class="faint" style="margin-top:-6px;">Submit a formal request to your coordinator to help resolve this swap.</p>'+
      '<div class="field"><label>Reason</label><textarea id="swapPanelReason" rows="3" placeholder="Explain why you need this swap..."></textarea></div>';
  }

  document.getElementById('drawerRoot').innerHTML =
    '<div class="drawer-backdrop" onclick="if(event.target===this) App.closeDrawer()"></div>'+
    '<div class="drawer-panel"><div class="drawer-head"><div><h2 class="mt0 mb0">Swap VCBC Session</h2><p class="faint">Choose your swap method. Swaps close '+SWAP_BUSINESS_RULES.swap_deadline_hours+' hours before your session starts.</p></div>'+
    '<button class="modal-close" onclick="App.closeDrawer()">\u2715</button></div>'+
    '<div class="drawer-body">'+tabsHtml+body+
    '<div class="modal-footer" style="padding:14px 0 0;border-top:none;"><button class="btn" onclick="App.closeDrawer()">Cancel</button><button class="btn btn-primary" id="swapPanelConfirmBtn" onclick="App.confirmSwapPanel(\''+lid+'\',\''+slotId+'\',\''+method+'\')">'+confirmLabel+'</button></div>'+
    '</div></div>';
  requestAnimationFrame(function(){
    var root = document.getElementById('drawerRoot');
    var bd = root.querySelector('.drawer-backdrop'); var p = root.querySelector('.drawer-panel');

function learnerProposeSwapModal(offerId, lid){
  var o = SWAP_POOL.find(function(x){return x.id===offerId;}); var s=getSlot(o.slotId); var sess=getSession(s.sessionId);
  var mySlots = VCBC_SLOTS.filter(function(x){return x.registeredLearnerIds.indexOf(lid)>-1 && daysUntil(x.date)>=1;});
  openModal('<div class="modal-header"><h3>Propose Session Swap</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
    '<div class="modal-body"><div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;margin-bottom:10px;"><strong>They want to swap:</strong><br/>'+esc(sess.name)+' \u2014 '+fmtDateTime(s.date,s.time)+'<br/>'+urgencyBadge(o.urgency)+' <span style="color:var(--success);font-weight:700;">'+o.compatibility+'% match</span></div>'+
    '<div class="field"><label>Your session to offer</label><select id="proposeMySlot"><option value="">Select one of your registered sessions</option>'+
    mySlots.map(function(x){ var xs=getSession(x.sessionId); return '<option value="'+x.id+'">'+esc(xs.name)+' \u2014 '+fmtDateTime(x.date,x.time)+'</option>'; }).join('')+'</select>'+
    '<div class="hint">Only sessions eligible for swapping are shown.</div></div>'+
    '<div class="field"><label>Why this swap works for you</label><textarea id="proposeReason" rows="3" placeholder="Explain why this swap would be beneficial..."></textarea></div></div>'+
    '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn btn-primary" onclick="App.sendSwapProposal(\''+offerId+'\',\''+lid+'\')">Send Proposal</button></div>');
}

function rotationDates(r){
  if(!r.liveDate) return [];
  return [0,1,3,4].map(function(off){ return isoDate(addDays(new Date(r.liveDate+'T00:00:00'), off)); });
}
window._rotFilters = {q:'', status:'all', site:'all'};
function rotationPunctualityBadge(status){
  return '<span class="badge '+(status==='Delayed'?'badge-danger':'badge-success')+'">'+esc(status)+'</span>';
}
function rotationCoordinationBadge(status){
  return '<span class="badge '+(status==='Behind Schedule'?'badge-warning':'badge-success')+'">'+esc(status)+'</span>';
}
function learnerRotations(lid){
  var mine = ROTATIONS.filter(function(r){return r.assignedLearnerIds.indexOf(lid)>-1;});
  var f = window._rotFilters;
  var sites = Array.from(new Set(mine.map(function(r){return getSite(r.siteId).name;})));
  var filtered = mine.filter(function(r){
    var site = getSite(r.siteId);
    var matchesQ = !f.q || r.name.toLowerCase().indexOf(f.q.toLowerCase())>-1 || r.id.toLowerCase().indexOf(f.q.toLowerCase())>-1;
    var matchesStatus = f.status==='all' || (f.status==='no-faculty' && !r.facultyIds.length) || (f.status!=='no-faculty' && r.punctuality===({'on-time':'On Time','delayed':'Delayed'})[f.status]);
    var matchesSite = f.site==='all' || site.name===f.site;
    return matchesQ && matchesStatus && matchesSite;
  });
  var filterBar = card('<h3 class="mt0">Filters &amp; Search</h3><div class="grid grid-4" style="margin-bottom:0;">'+
    '<div class="searchbox"><span>'+ic("search")+'</span><input placeholder="Search rotations..." value="'+esc(f.q)+'" oninput="App.updateRotFilter(\'q\',this.value)"/></div>'+
    '<select onchange="App.updateRotFilter(\'status\',this.value)"><option value="all">All Statuses</option><option value="on-time"'+(f.status==='on-time'?' selected':'')+'>On Time</option><option value="delayed"'+(f.status==='delayed'?' selected':'')+'>Delayed</option><option value="no-faculty"'+(f.status==='no-faculty'?' selected':'')+'>No Faculty Assigned</option></select>'+
    '<select onchange="App.updateRotFilter(\'site\',this.value)"><option value="all">All Sites</option>'+sites.map(function(s){return '<option value="'+esc(s)+'"'+(f.site===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>'+
    '<button class="btn" disabled style="opacity:.5;">'+ic("filter")+' More Filters</button>'+
    '</div>');
  var rows = filtered.map(function(r){
    var site = getSite(r.siteId);
    var fac = r.facultyIds.length ? getFaculty(r.facultyIds[0]) : null;
    var dates = rotationDates(r);
    var datesTxt = dates.length ? dates.map(function(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}).join(', ') : '\u2014';
    return {cells:[
      '<strong>'+esc(r.id)+'</strong>',
      ''+ic("location")+' '+esc(site.name),
      datesTxt,
      fac ? ''+ic("check")+' '+esc(fac.name.split(',')[0]) : '<span style="color:var(--danger);">'+ic("warning")+' Not Assigned</span>',
      rotationPunctualityBadge(r.punctuality),
      rotationCoordinationBadge(r.coordinationStatus),
      '<button class="iconbtn" title="Swap / Reschedule" onclick="App.openRotationSwapModal(\''+lid+'\',\''+r.id+'\')">'+ic("clock")+'</button>'
    ]};
  });
  var table = card('<h3 class="mt0">Rotation Schedule ('+filtered.length+' rotations)</h3>'+
    tableHtml(['Rotation ID','Site Name','Dates','Faculty','Status','Coordination','Actions'], rows, {emptyMessage:'No rotations match your search or filters.'}));
  var travel = learnerTravelCompanions(lid, filtered);
  return '<div class="pagehead"><div><h1>Rotations &amp; DFC Management</h1><p class="pagesub">View your assigned rotations and schedules</p></div></div>'+
    filterBar + table + travel;
}
function transportBadge(t){
  var cls = t==='Has Car' ? 'badge-info' : t==='Need ride' ? 'badge-warning' : 'badge-neutral';
  return '<span class="badge '+cls+'">'+(t==='Has Car'?''+ic("car")+' ':'')+esc(t)+'</span>';
}
function learnerTravelCompanions(lid, rotations){
  if(!rotations.length) return '';
  var groups = rotations.map(function(r){
    var companions = (TRAVEL_COMPANIONS[r.id]||[]).filter(function(c){return c.id!==lid;});
    var cards = companions.map(function(c){
      return '<div class="card" style="margin-bottom:0;">'+
        '<div class="card-title-row"><h3 class="mt0 mb0" style="font-size:15px;">'+esc(c.name)+'</h3>'+transportBadge(c.transportation)+'</div>'+
        '<div class="faint" style="margin-bottom:8px;">'+ic("location")+' '+esc(c.departure_location)+'</div>'+
        '<div style="font-size:13px;margin-bottom:6px;"><strong>Schedule:</strong><br/>'+esc(c.schedule.departure_time)+' - '+esc(c.schedule.arrival_time)+'<br/><span class="faint">'+c.schedule.days.join(', ')+'</span></div>'+
        '<div style="font-size:13px;margin-bottom:10px;"><strong>Notes:</strong><br/><span class="faint">'+esc(c.notes)+'</span></div>'+
        '<a class="btn btn-sm" style="width:100%;justify-content:center;" href="mailto:'+esc(c.email)+'">'+ic("email")+' Email</a></div>';
    }).join('');
    return card('<div class="card-title-row"><h3 class="mt0 mb0">'+ic("location")+' '+esc(r.name)+' ('+esc(r.id)+')</h3><span class="chip">'+companions.length+' student'+(companions.length===1?'':'s')+' available</span></div>'+
      (companions.length ? '<div class="grid grid-3">'+cards+'</div>' : '<p class="faint">No students opted in to share travel information for this rotation yet.</p>')+
      '<div class="divider"></div><p class="faint" style="margin:0;"><strong>Privacy Note:</strong> Only students who have opted in to share their travel information are displayed. To join this list or update your preferences, contact your coordinator.</p>');
  }).join('');
  return '<div style="margin-top:6px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><h2 style="margin:0;font-size:17px;">'+ic("people")+' Travel Companions</h2></div>'+
    '<p class="faint" style="margin:0 0 14px;">Connect with fellow learners for travel coordination and cost sharing. Only students who have opted in to share their schedules are shown.</p>'+groups+'</div>';
}
function rotationSwapModalHtml(lid, rid){
  var r = getRotation(rid); var site = getSite(r.siteId);
  var others = ROTATIONS.filter(function(x){return x.id!==rid && x.assignedLearnerIds.indexOf(lid)>-1;});
  return '<div class="modal-header"><h3>Swap/Reschedule Rotation</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
    '<div class="modal-body"><p class="faint" style="margin-top:-6px;">Request to swap or reschedule your rotation assignment.</p>'+
    '<div class="field"><label>Current Rotation</label><input type="text" value="'+esc(r.id)+' - '+esc(site.name)+'" disabled/></div>'+
    '<div class="field"><label>Swap With</label><select id="rotSwapTarget"><option value="">Select rotation to swap with</option>'+
    others.map(function(x){ return '<option value="'+x.id+'">'+esc(x.id)+' - '+esc(getSite(x.siteId).name)+'</option>'; }).join('')+'</select>'+
    (!others.length? '<div class="hint">You have no other assigned rotations to swap with.</div>':'')+'</div>'+
    '<div class="field"><label>Reason for Swap</label><textarea id="rotSwapReason" rows="3" placeholder="Explain why this swap is needed..."></textarea></div></div>'+
    '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn btn-primary" onclick="App.submitRotationSwap(\''+rid+'\')">Request Swap</button></div>';
}
/* -------- Tasks & Compliance Management (Learner) -------- */
function learnerTaskDisplayStatus(t){
  if(t.status==='Completed') return 'Completed';
  if(t.status==='Overdue') return 'Overdue';
  if(t.status==='Behind') return 'In Progress';
  return 'Pending';
}
function taskStatusBadge(ds){
  var map = {'Completed':'badge-success','In Progress':'badge-info','Overdue':'badge-danger','Pending':'badge-neutral'};
  var icon = {'Completed':'\u2713','In Progress':''+ic("clock")+'','Overdue':'\u2715','Pending':''+ic("clock")+''};
  return '<span class="badge '+(map[ds]||'badge-neutral')+'">'+icon[ds]+' '+ds+'</span>';
}
window._taskFilters = {q:'', status:'all', type:'all', role:'all'};
function learnerTasks(lid, tab){
  tab = tab || 'overview';
  var allTasks = LEARNER_TASKS.filter(function(t){return t.assigneeId===lid;});
  var tabDefs = [['overview','Compliance Overview'],['tasks','Task Management'],['rotations','Tasks by Rotation']];
  var tabsHtml = '<div style="display:flex;gap:4px;background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:18px;overflow-x:auto;">'+
    tabDefs.map(function(t){ return '<button class="btn btn-sm '+(tab===t[0]?'btn-primary':'btn-ghost')+'" style="flex:1;justify-content:center;white-space:nowrap;" onclick="App.go(\'#/learner/tasks/'+t[0]+'\')">'+t[1]+'</button>'; }).join('')+
    '</div>';
  var body = tab==='tasks' ? tasksTabManagement(allTasks) : tab==='rotations' ? tasksTabByRotation(allTasks) : tasksTabOverview(allTasks);
  return '<div class="pagehead"><div><h1>Tasks &amp; Compliance Management</h1><p class="pagesub">View and complete your assigned tasks and compliance requirements</p></div></div>'+
    tabsHtml + body;
}
function tasksTabOverview(tasks){
  var total = tasks.length;
  var completed = tasks.filter(function(t){return learnerTaskDisplayStatus(t)==='Completed';}).length;
  var inProgress = tasks.filter(function(t){return learnerTaskDisplayStatus(t)==='In Progress';}).length;
  var pending = tasks.filter(function(t){return learnerTaskDisplayStatus(t)==='Pending';}).length;
  var overdue = tasks.filter(function(t){return learnerTaskDisplayStatus(t)==='Overdue';}).length;
  var rate = total? Math.round(1000*completed/total)/10 : 0;
  function statCard(label, num, sub, color){ return card('<div class="card-title-row"><span class="faint" style="text-transform:none;font-weight:600;">'+label+'</span></div><div class="num" style="font-size:24px;font-weight:700;'+(color?'color:'+color+';':'')+'">'+num+'</div><p class="faint" style="margin:2px 0 0;">'+sub+'</p>', 'margin-bottom:0;'); }
  var stats = '<div class="grid grid-5">'+
    statCard('Total Tasks', total, 'Across all rotations')+
    statCard('Completed', completed, rate+'% completion rate', 'var(--success)')+
    statCard('In Progress', inProgress, 'Currently active', 'var(--info)')+
    statCard('Pending', pending, 'Awaiting action', 'var(--warning)')+
    statCard('Overdue', overdue, 'Requires attention', 'var(--danger)')+
    '</div>';
  var rateCard = card('<h3 class="mt0">Overall Compliance Rate</h3>'+
    '<div style="text-align:center;margin-bottom:14px;"><div style="font-size:38px;font-weight:700;color:var(--brand);">'+rate+'%</div><p class="faint" style="margin:0;">Overall Compliance</p></div>'+
    progressBar(rate)+
    '<div class="grid grid-4" style="margin-top:16px;text-align:center;">'+
    '<div><div style="font-weight:700;color:var(--success);">'+completed+'</div><p class="faint" style="margin:0;">Completed</p></div>'+
    '<div><div style="font-weight:700;color:var(--info);">'+inProgress+'</div><p class="faint" style="margin:0;">In Progress</p></div>'+
    '<div><div style="font-weight:700;color:var(--warning);">'+pending+'</div><p class="faint" style="margin:0;">Pending</p></div>'+
    '<div><div style="font-weight:700;color:var(--danger);">'+overdue+'</div><p class="faint" style="margin:0;">Overdue</p></div>'+
    '</div>');
  return stats + rateCard;
}
function tasksTabManagement(tasks){
  var f = window._taskFilters;
  var filtered = tasks.filter(function(t){
    var ds = learnerTaskDisplayStatus(t);
    var matchesQ = !f.q || t.title.toLowerCase().indexOf(f.q.toLowerCase())>-1;
    var matchesStatus = f.status==='all' || ds.toLowerCase().replace(' ','-')===f.status;
    var matchesType = f.type==='all' || t.type===f.type;
    var matchesRole = f.role==='all' || t.assigneeRole===f.role;
    return matchesQ && matchesStatus && matchesType && matchesRole;
  });
  var filterBar = card('<h3 class="mt0">Search &amp; Filter Tasks</h3><div class="grid grid-4" style="margin-bottom:0;">'+
    '<div class="searchbox"><span>'+ic("search")+'</span><input placeholder="Search tasks..." value="'+esc(f.q)+'" oninput="App.updateTaskFilter(\'q\',this.value)"/></div>'+
    '<select onchange="App.updateTaskFilter(\'status\',this.value)"><option value="all">All Statuses</option><option value="pending"'+(f.status==='pending'?' selected':'')+'>Pending</option><option value="in-progress"'+(f.status==='in-progress'?' selected':'')+'>In Progress</option><option value="completed"'+(f.status==='completed'?' selected':'')+'>Completed</option><option value="overdue"'+(f.status==='overdue'?' selected':'')+'>Overdue</option></select>'+
    '<select onchange="App.updateTaskFilter(\'type\',this.value)"><option value="all">All Types</option>'+['AdHoc','Learner Internal','Compliance','Rotation'].map(function(ty){return '<option value="'+ty+'"'+(f.type===ty?' selected':'')+'>'+ty+'</option>';}).join('')+'</select>'+
    '<select onchange="App.updateTaskFilter(\'role\',this.value)"><option value="all">All Roles</option><option value="Learner"'+(f.role==='Learner'?' selected':'')+'>Learner</option><option value="Coordinator"'+(f.role==='Coordinator'?' selected':'')+'>Coordinator</option><option value="Faculty"'+(f.role==='Faculty'?' selected':'')+'>Faculty</option></select>'+
    '</div>');
  if(!filtered.length) return filterBar + card(emptyState('No tasks match your search or filters.'));
  var cards = filtered.map(function(t){
    var ds = learnerTaskDisplayStatus(t);
    var rot = t.relatedRotationId ? getRotation(t.relatedRotationId) : null;
    return card('<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;" onclick="App.openTaskDetailModal(\''+t.id+'\')">'+
      '<div style="flex:1;min-width:220px;"><h3 class="mt0 mb0" style="font-size:15px;">'+esc(t.title)+'</h3>'+
      '<div class="faint" style="margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;"><span>'+ic("person")+' '+esc(t.assigneeRole)+'</span><span>'+ic("document")+' '+esc(t.type||'AdHoc')+'</span><span>'+ic("calendar")+' Due: '+fmtDate(t.dueDate)+'</span></div></div>'+
      '<div style="display:flex;align-items:center;gap:10px;">'+taskStatusBadge(ds)+
      '<button class="iconbtn" title="Upload" onclick="event.stopPropagation();App.openTaskDetailModal(\''+t.id+'\')">'+ic("arrow-up")+'</button></div></div>', 'margin-bottom:0;');
  }).join('');
  return filterBar + '<div class="grid" style="grid-template-columns:1fr;gap:12px;">'+cards+'</div>';
}
function tasksTabByRotation(tasks){
  var groups = {};
  tasks.forEach(function(t){ var key = t.relatedRotationId || '__general__'; (groups[key]=groups[key]||[]).push(t); });
  var keys = Object.keys(groups);
  if(!keys.length) return card(emptyState('No tasks assigned yet.'));
  return keys.map(function(key){
    var group = groups[key];
    var rot = key==='__general__' ? null : getRotation(key);
    var name = rot ? rot.name : 'General Tasks';
    var completed = group.filter(function(t){return learnerTaskDisplayStatus(t)==='Completed';}).length;
    var rate = Math.round(100*completed/group.length);
    var miniCards = group.map(function(t){
      var ds = learnerTaskDisplayStatus(t);
      return '<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;">'+
        '<div><div style="font-weight:600;">'+esc(t.title)+'</div><div class="faint">'+esc(t.assigneeRole)+' \u2022 Due: '+fmtDate(t.dueDate)+'</div></div>'+taskStatusBadge(ds)+'</div>';
    }).join('');
    return card('<div class="card-title-row"><div><h3 class="mt0 mb0">'+esc(name)+'</h3><p class="faint" style="margin:2px 0 0;">'+(rot? 'Rotation ID: '+esc(rot.id)+' \u2022 ':'')+group.length+' tasks</p></div>'+
      '<div style="text-align:right;"><div style="font-size:22px;font-weight:700;">'+rate+'%</div><p class="faint" style="margin:0;">Complete</p></div></div>'+
      progressBar(rate)+'<div class="grid grid-2" style="margin-top:12px;">'+miniCards+'</div>');
  }).join('');
}
function taskDetailModalHtml(tid){
  var t = LEARNER_TASKS.find(function(x){return x.id===tid;});
  var ds = learnerTaskDisplayStatus(t);
  var rot = t.relatedRotationId ? getRotation(t.relatedRotationId) : null;
  return '<div class="modal-header"><h3>Task Details</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
    '<div class="modal-body"><p class="faint" style="margin-top:-6px;">View and manage task details and compliance requirements.</p>'+
    '<div class="field"><label>Task Title</label><input type="text" value="'+esc(t.title)+'" disabled/></div>'+
    '<div class="grid grid-2"><div class="field"><label>Role</label><input type="text" value="'+esc(t.assigneeRole)+'" disabled/></div>'+
    '<div class="field"><label>Type</label><input type="text" value="'+esc(t.type||'AdHoc')+'" disabled/></div></div>'+
    '<div class="grid grid-2"><div class="field"><label>Status</label><div style="padding-top:4px;">'+taskStatusBadge(ds)+'</div></div>'+
    '<div class="field"><label>Due Date</label><input type="text" value="'+fmtDate(t.dueDate)+'" disabled/></div></div>'+
    '<div class="field"><label>Rotation</label><input type="text" value="'+(rot? esc(rot.name) : 'Not linked to a rotation')+'" disabled/></div>'+
    '<div class="field"><label>Notes/Comments</label><textarea id="taskNotes" rows="3" placeholder="Add notes about this task..."></textarea></div>'+
    '<div class="field"><label>Upload Documents</label><div style="border:2px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;">'+
    ''+ic("upload")+'<p class="faint" style="margin:6px 0;">Drag and drop files here, or click to select files</p>'+
    '<input type="file" id="taskUploadFile" style="display:none;" onchange="App.taskFileChosen(this)"/>'+
    '<button class="btn btn-sm" onclick="document.getElementById(\'taskUploadFile\').click()">Choose Files</button>'+
    '<div id="taskFileChosenName" class="faint" style="margin-top:6px;"></div></div></div></div>'+
    '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Close</button><button class="btn btn-primary" onclick="App.updateTaskFromModal(\''+t.id+'\')">Update Task</button></div>';
}
function learnerCompliance(lid){
  var recs = COMPLIANCE.filter(function(c){return c.learnerId===lid;});
  var pct = learnerCompliancePct(lid);
  var nextItem = recs.find(function(r){return r.status!=='Compliant';});
  var rows = recs.map(function(r){
    var action = r.status==='Compliant' ? '\u2014' : '<a onclick="App.go(\'#/learner/compliance/upload/'+r.id+'\')">'+(r.status==='Non-Compliant'&&r.rejectReason?'Resubmit':'Upload')+'</a>';
    var exp = r.dueDate ? fmtDate(r.dueDate)+(daysUntil(r.dueDate)<=14?' '+ic("warning")+'':'') : 'No Expiration';
    return {cells:[esc(r.type)+' - ('+r.code+')', badge(r.status), exp, action]};
  });
  return '<div class="pagehead"><div><h1>My Compliance</h1></div></div>'+
    card('<div class="card-title-row"><h3 class="mt0 mb0">'+pct+'% complete</h3></div>'+progressBar(pct)+
    (nextItem? '<div class="callout callout-warning" style="margin-top:12px;">Next: '+esc(nextItem.type)+'. <a onclick="App.go(\'#/learner/compliance/upload/'+nextItem.id+'\')">Resolve now</a></div>' : '<div class="callout callout-success" style="margin-top:12px;">All requirements are compliant.</div>'))+
    card(tableHtml(['Category','Status','Expiration','Action'], rows));
}
function learnerComplianceUpload(lid, cid){
  var rec = COMPLIANCE.find(function(c){return c.id===cid;}); if(!rec) return renderNoAccess();
  return '<div class="crumb"><a onclick="App.go(\'#/learner/compliance\')">My Compliance</a> / '+esc(rec.type)+'</div>'+
    '<div class="pagehead"><div><h1>Upload \u2014 '+esc(rec.type)+'</h1></div></div>'+
    (rec.rejectReason ? '<div class="callout callout-danger">Your '+esc(rec.type)+' was not approved: '+esc(rec.rejectReason)+'. Please resubmit.</div>' : '')+
    card('<div class="field"><label>Choose file</label><input type="file" id="uploadFile"/><div class="hint">PDF, JPG, or PNG. Max 10MB.</div></div>'+
    '<button class="btn btn-primary" onclick="App.submitUpload(\''+cid+'\')">Submit for review</button>');
}
function learnerComplianceHistory(lid){
  var recs = COMPLIANCE.filter(function(c){return c.learnerId===lid && c.submittedAt;});
  return '<div class="pagehead"><div><h1>Document History</h1></div></div>'+
    card(tableHtml(['Requirement','Status','Submitted'], recs.map(function(r){return {cells:[esc(r.type), badge(r.status), fmtDate(r.submittedAt)]};}), {emptyMessage:'No documents submitted yet.'}));
}
function learnerPracticum(lid){
  var mine = PRACTICUM_UNDERGRAD.concat(PRACTICUM_GRAD).filter(function(p){return p.learnerId===lid;});
  var rows = mine.map(function(p){
    return {cells:[p.siteAssigned? esc(p.siteAssigned.site): '<span class="faint">Not yet assigned</span>', p.siteAssigned? badge('scheduled') : badge('Pending'), '\u2014']};
  });
  return '<div class="pagehead"><div><h1>My Practicum</h1></div><button class="btn btn-sm" onclick="App.go(\'#/learner/practicum/propose\')">Propose a site</button></div>'+
    card(tableHtml(['Site','Status','Action'], rows, {emptyMessage:'No practicum placement yet.', emptyActionLabel:'Propose a site', emptyActionOnclick:"App.go('#/learner/practicum/propose')"}));
}
function learnerSiteProposal(lid){

function dispatchCoordinator(p, route){
  if(p[1]==='dashboard' || p.length<2) return coordinatorTriageQueue();

  if(p[1]==='task-templates') return taskManagerScreen('#/coordinator/task-templates');
  if(p[1]==='rotation' && p[2]==='coordination' && p[3]) return coordinatorStartCoordination(p[3]);
  if(p[1]==='rotation' && p[2]==='attestation' && p[3]) return coordinatorAttestation(p[3]);
  if(p[1]==='rotation' && p[2]==='assign' && p[3]) return coordinatorAssignLearners(p[3]);
  if(p[1]==='compliance-queue' && p[2]) return coordinatorComplianceItem(p[2]);
  if(p[1]==='compliance-queue') return coordinatorComplianceQueue();
  if(p[1]==='renewals') return coordinatorRenewals();
  if(p[1]==='exceptions' && p[2]) return coordinatorExceptionDetail(p[2]);
  if(p[1]==='exceptions') return coordinatorExceptions();
  if(p[1]==='practicum' && p[2]==='undergrad' && p[3] && p[4]==='assign') return practicumAssignSite(p[3], '#/coordinator/practicum/undergrad', PRACTICUM_UNDERGRAD);
  if(p[1]==='practicum' && p[2]==='graduate' && p[3] && p[4]==='assign') return practicumAssignSite(p[3], '#/coordinator/practicum/graduate', PRACTICUM_GRAD);
  if(p[1]==='practicum' && p[2]==='undergrad') return practicumScreen('Undergraduate', PRACTICUM_UNDERGRAD, '#/coordinator/practicum/undergrad');
  if(p[1]==='practicum' && p[2]==='graduate') return practicumScreen('Graduate', PRACTICUM_GRAD, '#/coordinator/practicum/graduate');
  return renderNoAccess();
}
function triageList(){
  return LEARNERS.map(function(l){
    var behindTasks = LEARNER_TASKS.filter(function(t){return t.assigneeId===l.id && (t.status==='Behind'||t.status==='Overdue');});
    var comp = learnerComplianceStatus(l.id);
    var score = (behindTasks.length*10) + (comp==='Non-Compliant'?15:comp==='Pending Compliance'?5:0) + (l.predictedLate?8:0);
    // Days until the learner's next rotation: the closer it is, the more outstanding work weighs.
    var soon = ROTATIONS.filter(function(r){return r.liveDate && r.assignedLearnerIds.indexOf(l.id)>-1 && daysUntil(r.liveDate)>=0;}).map(function(r){return daysUntil(r.liveDate);}).sort(function(a,b){return a-b;})[0];
    if(score>0 && soon!==undefined && soon<=14) score += (14-soon);
    return {learner:l, behindTasks:behindTasks, comp:comp, score:score};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;});
}

(function(){

  });
  [[10,'Tdap'],[11,'MMR'],[12,'Varicella'],[13,'Hepatitis B'],[14,'HIPAA Certificate'],[15,'Infection Control']].forEach(function(p,i){
    var l = LEARNERS[p[0]]; var c = COMPLIANCE.find(function(x){return x.learnerId===l.id && x.type===p[1];});
    if(c && c.status==='Compliant'){ c.status='Pending Compliance'; c.submittedAt=isoDate(addDays(NOW,-(i%3))); c.fileName=c.code.toLowerCase()+'_upload.pdf'; }
  });
  var first = COMPLIANCE.filter(function(c){return c.status==='Pending Compliance' && c.submittedAt;})[2];
  if(first) first.conflict = true;
})();

  var s = {onTime:0, behind:0, allClear:0, nonCompliant:[], learners:r.assignedLearnerIds.map(getLearner)};

  var rots = ROTATIONS.filter(function(r){return r.published || r.status==='Sent to Faculty' || r.status==='Draft';});
  var totalBlocked = 0;
  var rows = rots.map(function(r){
    var site = getSite(r.siteId); var s = rotationStatusSummary(r); var bl = rotationBlockers(r);
    if(bl.length) totalBlocked++;
    var total = s.learners.length; var cleared = total - s.nonCompliant.length - s.behind;
    var pct = total ? Math.round(100*s.allClear/total) : 0;
    var st = coordStage(r);
    var action;
    if(r.attestationSent) action = '<a class="btn btn-sm" onclick="App.go(\'#/coordinator/rotation/attestation/'+r.id+'\')">View</a>';
    else if(r.coordinationStarted) action = '<a class="btn btn-sm btn-primary" onclick="App.go(\'#/coordinator/rotation/attestation/'+r.id+'\')">Attestation</a>';
    else action = '<a class="btn btn-sm btn-primary" onclick="App.go(\'#/coordinator/rotation/coordination/'+r.id+'\')">Start coordination</a>';
    return {cells:[
      '<strong>'+esc(r.name)+'</strong><div class="faint" style="font-size:11.5px;">'+esc(site?site.name:'—')+'</div>',
      r.liveDate? fmtDate(r.liveDate) : '<span class="faint">Not set</span>',
      '<div style="min-width:120px;">'+progressBar(pct)+'<div class="faint" style="font-size:11.5px;margin-top:2px;">'+s.allClear+' of '+total+' All Clear</div></div>',
      s.onTime+' On Time · '+s.behind+' Behind · '+s.allClear+' All Clear',
      bl.length ? '<span style="color:var(--danger);">'+ic("warning")+' '+bl.length+' to fix</span>' : '<span style="color:var(--success);">'+ic("check")+' Ready</span>',
      '<span class="badge '+st.cls+'">'+st.label+'</span>',
      action]};
  });
  return '<div class="pagehead"><div><h1>Readiness Tracker</h1><p class="pagesub">Rotations by readiness. Blockers are listed before you start, not after.</p></div></div>'+
    (totalBlocked? '<div class="callout callout-warning">'+totalBlocked+' rotation'+(totalBlocked>1?'s have':' has')+' items to fix before coordination can start.</div>' : '')+
    card(tableHtml(['Rotation','Live date','Progress','Status summary','Pre-flight','Stage','Action'], rows, {emptyMessage:'No rotations yet.'}));
}

function coordinatorStartCoordination(rid){
  var r = getRotation(rid); if(!r) return renderNoAccess();
  var site = getSite(r.siteId); var s = rotationStatusSummary(r); var bl = rotationBlockers(r);
  var checks = [
    ['template', !!r.taskTemplateId, 'Task template assigned'],
    ['site', site && !siteMissingField(site), 'Site record complete'],
    ['faculty', r.facultyIds.length>0, 'Faculty assigned'],
    ['learners', r.assignedLearnerIds.length>0, r.assignedLearnerIds.length+' of '+r.capacity+' learner seats assigned']
  ].map(function(c){
    return '<div class="checkbox-row" style="display:flex;gap:8px;align-items:center;padding:6px 0;"><span style="color:'+(c[1]?'var(--success)':'var(--danger)')+';">'+ic(c[1]?'check':'warning')+'</span><span>'+esc(c[2])+'</span></div>';
  }).join('');
  var blockMsgs = bl.map(function(b){
    return '<div class="callout callout-danger">'+esc(b.msg)+(b.fix? ' <a onclick="App.go(\''+b.fix+'\')">'+b.fixLabel+'</a>' : ' <span class="faint">('+b.fixLabel+')</span>')+'</div>';
  }).join('');
  var rows = s.learners.map(function(l){
    var tasks = LEARNER_TASKS.filter(function(t){return t.assigneeId===l.id && t.relatedRotationId===r.id;});
    var open = tasks.filter(function(t){return t.status!=='Completed';});
    return {cells:['<a onclick="App.open360(\''+l.id+'\')">'+esc(l.name)+'</a>', badge(learnerComplianceStatus(l.id)), open.length+' open', open.length? badge(open[0].status):badge('All Clear')]};
  });
  var started = r.coordinationStarted;
  return '<div class="crumb"><a onclick="App.go(\'#/coordinator/readiness\')">Readiness Tracker</a> / Start coordination</div>'+
    '<div class="pagehead"><div><h1>Start Coordination — '+esc(r.name)+'</h1><p class="pagesub">'+esc(site?site.name:'')+(r.liveDate?' · Live '+fmtDate(r.liveDate):'')+'</p></div>'+
      (started? '<span class="badge badge-success">'+ic("check")+' Coordination started</span>'
        : '<button class="btn btn-primary" '+(bl.length?'disabled style="opacity:.5;"':'')+' onclick="App.startCoordination(\''+r.id+'\')">Start coordination</button>')+'</div>'+
    blockMsgs +
    '<div class="grid grid-2"><div class="card"><h3 class="mt0">Pre-flight checklist</h3>'+checks+'</div>'+
    '<div class="card"><h3 class="mt0">Status summary</h3><p>'+s.onTime+' learners On Time, '+s.behind+' Behind, '+s.allClear+' All Clear for '+esc(r.name)+'.</p>'+
    '<p class="muted" style="font-size:12.5px;">Starting coordination assigns the task template to every learner below and sends them a notification.</p>'+
    '<a class="btn btn-sm" onclick="App.go(\'#/coordinator/rotation/assign/'+r.id+'\')">Manage learners</a> <a class="btn btn-sm" onclick="App.go(\'#/coordinator/rotation/attestation/'+r.id+'\')">Go to attestation</a></div></div>'+
    card('<h3 class="mt0">Learners ('+s.learners.length+')</h3>'+tableHtml(['Learner','Compliance','Open tasks','Status'], rows, {emptyMessage:'No learners assigned yet.'}));
}

function coordinatorAttestation(rid){
  var r = getRotation(rid); if(!r) return renderNoAccess();
  var site = getSite(r.siteId); var s = rotationStatusSummary(r);
  var blockers = s.nonCompliant; var total = s.learners.length; var cleared = total - blockers.length;
  var rows = s.learners.map(function(l){
    var bad = blockers.indexOf(l)>-1;
    return {cells:[
      '<a onclick="App.open360(\''+l.id+'\')">'+esc(l.name)+'</a>', badge(learnerComplianceStatus(l.id)),
      bad ? '<span style="color:var(--danger);">'+ic("warning")+' Blocking</span>' : '<span style="color:var(--success);">'+ic("check")+' Cleared</span>',
      bad ? '<button class="btn btn-sm" onclick="App.remindLearner(\''+l.id+'\')">Send reminder</button> <button class="btn btn-sm" onclick="App.tagLearner(\''+l.id+'\',\'Urgent\')">Tag Urgent</button>' : ''
    ]};
  });
  var status;
  if(r.attestationSent) status = '<div class="callout callout-success">Attestation sent to '+esc(site?site.name:'the site')+' on '+fmtDate(r.attestationSent)+'.</div>';
  else if(blockers.length) status = '<div class="callout callout-danger">Attestation cannot be generated — '+blockers.length+' learner'+(blockers.length>1?'s are':' is')+' still Non-Compliant.</div>';
  else if(r.attested) status = '<div class="callout callout-success">Attestation file is ready. Send it to '+esc(site?site.name:'the site')+' when you are ready.</div>';
  else status = '<div class="callout callout-info">All '+total+' learners are cleared. You can generate the attestation.</div>';
  var actions = r.attestationSent ? '' : (!r.attested
    ? '<button class="btn btn-primary" '+(blockers.length||!total?'disabled style="opacity:.5;"':'')+' onclick="App.generateAttestation(\''+r.id+'\')">Generate attestation</button>'
    : '<button class="btn btn-primary" onclick="App.sendAttestation(\''+r.id+'\')">Send to site</button>');
  return '<div class="crumb"><a onclick="App.go(\'#/coordinator/readiness\')">Readiness Tracker</a> / Attestation</div>'+
    '<div class="pagehead"><div><h1>Attestation — '+esc(r.name)+'</h1><p class="pagesub">'+cleared+' of '+total+' learners cleared for '+esc(r.name)+(r.liveDate?' starting '+fmtDate(r.liveDate):'')+'.</p></div><div>'+actions+'</div></div>'+
    status + card(progressBar(total?Math.round(100*cleared/total):0)) +
    card('<h3 class="mt0">Blocker checklist</h3>'+tableHtml(['Learner','Compliance','Attestation','Fix'], rows, {emptyMessage:'No learners assigned yet.'}));
}

function dispatchSpecialist(p, route){
  if(p[1]==='dashboard' || p.length<2) return specialistDashboard();
  if(p[1]==='sites') return specialistSites();
  if(p[1]==='sofes') return specialistSofes();
  if(p[1]==='task-templates') return taskManagerScreen('#/specialist/task-templates');
  if(p[1]==='rotations' && p[2]==='new') return rotationBuilder();
  if(p[1]==='rotations' && p[2]) return rotationBuilder(p[2]);
  if(p[1]==='rotations') return specialistRotations();
  return renderNoAccess();
}

    card('<h3 class="mt0">Rotations <span class="faint">'+ROTATIONS.length+'</span></h3>'+tableHtml(['Name','Dates','Site','Faculty','Status','Actions'], rows, {emptyMessage:'No rotations yet.'}));

function rotationBuilder(id){
  var r = id? getRotation(id) : null;
  var missing = [];
  if(r){ if(!r.facultyIds.length) missing.push('Faculty'); if(!r.days.length) missing.push('Days'); if(!getSite(r.siteId)) missing.push('Site'); }
  var pct = r? Math.round(100*r.assignedLearnerIds.length/r.capacity) : 0;
  return '<div class="crumb"><a onclick="App.go(\'#/specialist/rotations\')">Rotations</a> / '+(r?esc(r.name):'New')+'</div>'+
    '<div class="pagehead"><div><h1>Rotation Builder</h1></div></div>'+
    (missing.length? '<div class="callout callout-warning">Cannot set a live date \u2014 missing: '+missing.join(', ')+'.</div>':'')+
    card('<div class="field"><label>Name</label><input type="text" id="rotName" value="'+(r?esc(r.name):'')+'"/></div>'+
    '<div class="field"><label>Site</label><select id="rotSite">'+SITES.map(function(s){return '<option value="'+s.id+'"'+(r&&r.siteId===s.id?' selected':'')+'>'+esc(s.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Faculty</label><select id="rotFaculty">'+FACULTY.map(function(f){return '<option value="'+f.id+'"'+(r&&r.facultyIds[0]===f.id?' selected':'')+'>'+esc(f.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Days</label><input type="text" id="rotDays" value="'+(r?esc(r.days.join(', ')):'')+'" placeholder="e.g. Mon, Wed"/></div>'+
    '<div class="field"><label>Live date</label><input type="date" id="rotLiveDate" value="'+(r&&r.liveDate?r.liveDate:'')+'"/></div>'+
    '<div class="field"><label>Task template</label><select id="rotTemplate"><option value="">None</option>'+TASK_TEMPLATES.map(function(t){return '<option value="'+t.id+'"'+(r&&r.taskTemplateId===t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</select></div>'+
    (r? '<div class="field"><label>Capacity fill</label>'+progressBar(pct)+'<div class="hint">'+r.assignedLearnerIds.length+' of '+r.capacity+' filled</div></div>':'')+
    '<button class="btn btn-primary" onclick="App.saveRotation(\''+(r?r.id:'')+'\')">Save</button> '+
    (r && !r.published? '<button class="btn" onclick="App.publishRotation(\''+r.id+'\')">Publish</button>':'')+' '+
    '<button class="btn" onclick="App.go(\'#/specialist/rotations\')">Cancel</button>');
}

/* ============================== ADMIN ============================== */
function dispatchAdmin(p, route){
  if(p[1]==='dashboard' || p.length<2) return adminDashboard();
  if(p[1]==='vcbc' && p[2]==='session' && p[3] && p[4]==='slot' && p[5]) return adminSlotDetail(p[3], p[5]);
  if(p[1]==='vcbc' && p[2]==='session' && p[3]) return adminSessionDetail(p[3]);
  if(p[1]==='vcbc') return adminVcbcManagement();
  if(p[1]==='compliance' && p[2]) { openLearnerDrawer(p[2],'Compliances'); return adminCompliance(); }
  if(p[1]==='compliance') return adminCompliance();
  if(p[1]==='practicum' && p[2]==='undergrad' && p[3] && p[4]==='assign') return practicumAssignSite(p[3], '#/admin/practicum/undergrad', PRACTICUM_UNDERGRAD);
  if(p[1]==='practicum' && p[2]==='graduate' && p[3] && p[4]==='assign') return practicumAssignSite(p[3], '#/admin/practicum/graduate', PRACTICUM_GRAD);
  if(p[1]==='practicum' && p[2]==='undergrad') return practicumScreen('Undergraduate', PRACTICUM_UNDERGRAD, '#/admin/practicum/undergrad');
  if(p[1]==='practicum' && p[2]==='graduate') return practicumScreen('Graduate', PRACTICUM_GRAD, '#/admin/practicum/graduate');
  if(p[1]==='users') return adminUsers();
  if(p[1]==='roles') return adminRoles();
  if(p[1]==='courses') return adminCourses();
  if(p[1]==='scheduling') return adminScheduling();
  if(p[1]==='reports' && p[2]==='builder') return adminReportBuilder();
  if(p[1]==='reports' && p[2]==='saved') return adminSavedReports();
  if(p[1]==='reports' && p[2]==='results') return adminReportResults();
  if(p[1]==='reports') return adminReportLibrary();
  if(p[1]==='system-health') return adminSystemHealth();
  if(p[1]==='info-editor' && p[2]) return infoEditorDetail(p[2]);
  if(p[1]==='info-editor') return infoEditorList();
  return renderNoAccess();
}

/* -------- Dashboard with charts -------- */
function adminDashboard(){
  var claimedSlots = VCBC_SLOTS.filter(function(s){return s.facultyId;});
  var unassignedFaculty = VCBC_SLOTS.filter(function(s){return !s.facultyId;}).length;
  var totalRegs = VCBC_SLOTS.reduce(function(sum,s){return sum+s.registeredLearnerIds.length;},0);
  var closedSessions = VCBC_SESSIONS.filter(function(s){return s.status==='closed';}).length;
  var makeUpSessions = VCBC_SESSIONS.filter(function(s){return s.type==='Make Up';}).length;

  var totalCapacity = ROTATIONS.reduce(function(s,r){return s+r.capacity;},0);
  var totalFilled = ROTATIONS.reduce(function(s,r){return s+r.assignedLearnerIds.length;},0);
  var scheduledRot = ROTATIONS.filter(function(r){return r.published;}).length;
  var unscheduledRot = ROTATIONS.length - scheduledRot;
  var compLearnersInRot = {}; ROTATIONS.forEach(function(r){ r.assignedLearnerIds.forEach(function(lid){ compLearnersInRot[lid]=true; }); });
  var rotLearnerIds = Object.keys(compLearnersInRot);
  var compliantInRot = rotLearnerIds.filter(function(lid){return learnerComplianceStatus(lid)==='Compliant';}).length;
  var nonCompliantInRot = rotLearnerIds.length - compliantInRot;

  function statInline(num,label){ return '<div style="flex:1;min-width:130px;"><div style="font-size:26px;font-weight:700;">'+num+'</div><div class="faint">'+label+'</div></div>'; }
  var vcbcStats = card('<h3 class="mt0 mb0" style="margin-bottom:10px;">Stats</h3><div style="display:flex;gap:22px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;">'+
    statInline(claimedSlots.length,'Scheduled Slots')+
    statInline(unassignedFaculty,'No Assigned Faculty')+
    statInline(totalRegs.toLocaleString(),'Scheduled VCBC-Learner')+
    statInline(closedSessions,'Closed Sessions')+
    statInline(makeUpSessions,'Make Up Sessions')+
    '</div>');

  var barChart = stackedBarChart('No. of Assigned Faculties', [
    {label:'Seats', segments:[{label:'Filled', value:totalFilled, color:'#152742'},{label:'Not Filled', value:Math.max(0,totalCapacity-totalFilled), color:'#c7cdd6'}]},
    {label:'Faculty', segments:[{label:'Unassigned', value:unassignedFaculty, color:'#c9a13b'},{label:'Assigned', value:claimedSlots.length, color:'#e8d49b'}]}
  ], true);

  var donut1 = donutChart('Slot Utilization: '+totalCapacity+' Total Seats', [
    {label:'Available Seats', value:Math.max(0,totalCapacity-totalFilled), color:'#c9a13b'},
    {label:'Unavailable Seats', value:totalFilled, color:'#152742'}
  ], true);
  var donut2 = donutChart('Rotations Fully Scheduled', [
    {label:'Unscheduled', value:unscheduledRot, color:'#c9a13b'},
    {label:'Scheduled', value:scheduledRot, color:'#152742'}
  ], true);
  var donut3 = donutChart('Rotation Coordination', [
    {label:'Compliant', value:compliantInRot, color:'#c9a13b'},
    {label:'Non-compliant', value:nonCompliantInRot, color:'#152742'}
  ], true);

  var compDonut = donutChart('Compliance Overview', [
    {label:'Compliant', value:LEARNERS.filter(function(l){return learnerComplianceStatus(l.id)==='Compliant';}).length, color:'#1e7e46'},
    {label:'Pending', value:LEARNERS.filter(function(l){return learnerComplianceStatus(l.id)==='Pending Compliance';}).length, color:'#c9a13b'},
    {label:'Non-Compliant', value:LEARNERS.filter(function(l){return learnerComplianceStatus(l.id)==='Non-Compliant';}).length, color:'#a82a20'}
  ], false);

  return '<div class="pagehead"><div><h1>Dashboard</h1></div></div>'+
    '<h3 class="mt0">VCBC Overview</h3>'+vcbcStats+
    '<h3>DFC Overview</h3>'+barChart+
    '<div class="grid grid-3" style="margin-top:14px;">'+donut1+donut2+donut3+'</div>'+
    '<h3>Compliance Overview</h3><div class="grid grid-2">'+compDonut+whatsNextPanel([
      {label: unassignedFaculty+' VCBC slots have no assigned faculty', link:"App.go('#/admin/vcbc')"},
      {label: nonCompliantInRot+' learners in active rotations are non-compliant', link:"App.go('#/admin/compliance')"},
      {label: SYSTEM_HEALTH.filter(function(c){return c.status!=='ok';}).length+' system alerts need attention', link:"App.go('#/admin/system-health')"}
    ])+'</div>';
}

    openModal('<div class="modal-header"><h3>Create Mapped Course</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
      '<div class="modal-body"><div class="field"><label>Course Name</label><input type="text" id="courseName"/></div>'+
      '<div class="field"><label>Code</label><input type="text" id="courseCode"/></div></div>'+
      '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn btn-primary" onclick="App.saveNewCourse()">Create</button></div>');
  },
  saveNewCourse: function(){
    var name=document.getElementById('courseName').value, code=document.getElementById('courseCode').value;
    if(!name||!code){ toast('Please complete all fields.'); return; }
    COURSE_CONFIG.push({name:name, code:code, vcbc:false, dfc:false, practicum:false, practicumGrad:false});
    toast('Course mapped.'); closeModal(); navigate('#/admin/courses');
  },
  saveGenericSettings: function(label){ toast(label+' saved.'); },
  previewReport: function(id){
    var t = REPORT_TEMPLATES.find(function(x){return x.id===id;});
    window._lastReport = {fields:['Name','Program','Status'], rows: LEARNERS.slice(0,10).map(function(l){return [l.name,l.program,learnerComplianceStatus(l.id)];}), partial: t.status==='Partial' || t.status==='Limited'};
    navigate('#/admin/reports/results');
  },
  generateReport: function(){
    var fields = Array.prototype.slice.call(document.querySelectorAll('.rb-field:checked')).map(function(c){return c.value;});
    if(!fields.length){ toast('Please select at least one field before generating a report.'); return; }
    var filter = document.getElementById('rbFilter').value; var data = LEARNERS;
    if(filter==='noncompliant') data = data.filter(function(l){return learnerComplianceStatus(l.id)==='Non-Compliant';});
    window._lastReport = {fields:fields, rows: data.map(function(l){ return fields.map(function(f){ if(f==='Name') return l.name; if(f==='Program') return l.program; if(f==='Status') return learnerComplianceStatus(l.id); return '\u2014'; }); }), partial:false};
    toast(window._lastReport.rows.length+' records found.'); navigate('#/admin/reports/results');
  },
  saveAsSmartReport: function(){ SAVED_REPORTS.push({id:uid('saved'), name:'Custom report \u2014 '+fmtDate(TODAY_ISO), templateId:null, pinned:true, resultCount: window._lastReport? window._lastReport.rows.length:0}); toast('Report configuration saved.'); navigate('#/admin/reports/saved'); },
  exportReport: function(){ toast('Export started (simulated).'); },
  publishInfoArticle: function(id){ var a=INFO_ARTICLES.find(function(x){return x.id===id;}); a.status='Published'; toast('Published.'); render(); },
  deleteInfoArticle: function(id){ var idx=INFO_ARTICLES.findIndex(function(x){return x.id===id;}); INFO_ARTICLES.splice(idx,1); toast('Deleted.'); navigate('#/admin/info-editor'); },
  editInfoArticleModal: function(id){
    var a = INFO_ARTICLES.find(function(x){return x.id===id;});
    openModal('<div class="modal-header"><h3>Edit</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
      '<div class="modal-body"><div class="field"><label>Title</label><input type="text" id="infoTitle" value="'+esc(a.title)+'"/></div>'+
      '<div class="field"><label>Body</label><textarea id="infoBody" rows="5">'+esc(a.body)+'</textarea></div></div>'+
      '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn btn-primary" onclick="App.saveInfoArticle(\''+id+'\')">Save & Close</button></div>');
  },
  saveInfoArticle: function(id){ var a=INFO_ARTICLES.find(function(x){return x.id===id;}); a.title=document.getElementById('infoTitle').value; a.body=document.getElementById('infoBody').value; toast('Saved.'); closeModal(); navigate('#/admin/info-editor'); },
  generateCrossModuleReport: function(){ toast('Cross-module report generated.'); },

  /* ---- Impersonation ---- */
  openImpersonateModal: function(){
    openModal('<div class="modal-header"><h3>View as</h3><button class="modal-close" onclick="App.closeModal()">\u2715</button></div>'+
      '<div class="modal-body"><div class="field"><label>Learner</label><select id="impLearner">'+LEARNERS.map(function(l){return '<option value="'+l.id+'">'+esc(l.name)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>Mode</label><select id="impMode"><option value="view">View only</option><option value="act">Act as</option></select></div></div>'+
      '<div class="modal-footer"><button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn btn-primary" onclick="App.startImpersonation()">Start</button></div>');
  },
  startImpersonation: function(){
    var lid = document.getElementById('impLearner').value; var l = getLearner(lid);
    state.impersonating = {role:'Learner', id:lid, name:l.name};
    closeModal(); toast('Now viewing as '+l.name+'.'); navigate('#/learner/dashboard');
  }
};
window.App = App;

/* ============================== INIT ============================== */
function init(){ renderLogin(); }
init();

})();
</script>
</body>
</html>
