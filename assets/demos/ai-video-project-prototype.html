<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightingale — Adaptive Tutoring Platform Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   NIGHTINGALE EDUCATION GROUP — DESIGN TOKENS
   Derived from Brand Guidelines 2026
══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  /* ─── Brand core (exact values from the guideline) ─── */
  --midnight-teal:#16445C;
  --warm-cream:#FAF0D9;
  --golden-ochre:#E3B03B;
  --burnt-sienna:#9A4E2A;
  --sage-green:#5E8F78;
  --brand-white:#FFFFFF;
  --near-black:#1A1A1A;

  /* ─── Typography ─── */
  --font-serif:"DM Serif Text",Georgia,"Times New Roman",serif;
  --font-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --track:-0.015em; /* guideline tracking -15 */

  --text-xs:11px;--text-sm:12px;--text-base:13px;--text-md:14px;
  --text-lg:16px;--text-xl:19px;--text-2xl:26px;--text-3xl:34px;
  --radius-xs:4px;--radius-sm:6px;--radius-md:9px;--radius-lg:12px;--radius-xl:18px;--radius-2xl:28px;--radius-pill:100px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --ease:cubic-bezier(.2,.8,.2,1);--dur-fast:120ms;--dur-base:180ms;
}
/* ─── LIGHT: Warm Cream primary. The brand's default expression. ─── */
:root,[data-theme="light"]{
  --bg-app:#FAF0D9;--bg-sidebar:#16445C;--bg-surface:#F6EBD3;
  --bg-card:#FFFFFF;--bg-card-alt:#FCF6E8;--bg-hover:#F2E5C8;
  --bg-input:#FFFFFF;
  --fg-strong:#16445C;--fg-default:#2B4150;--fg-muted:#5E7383;--fg-subtle:#8A9AA6;
  --fg-on-navy:#FFFFFF;--fg-on-gold:#1A1A1A;--fg-on-sienna:#FFFFFF;
  --border-strong:#D4C6A6;--border-default:#E7DCC3;--border-subtle:#F2EAD8;
  --accent-gold:#8A6410;--accent-gold-fill:#E3B03B;--accent-gold-soft:rgba(227,176,59,0.22);
  --status-red:#9A4E2A;--status-red-soft:rgba(154,78,42,0.13);
  --status-gold:#8A6410;--status-gold-soft:rgba(227,176,59,0.24);
  --status-green:#3F7457;--status-green-soft:rgba(94,143,120,0.20);
  --status-blue:#16445C;--status-blue-soft:rgba(22,68,92,0.11);
  --status-orange:#9A4E2A;--status-orange-soft:rgba(154,78,42,0.13);
  --status-purple:#7A5A16;--status-purple-soft:rgba(227,176,59,0.16);
  --status-teal:#3F7457;--status-teal-soft:rgba(94,143,120,0.16);
  --shadow-1:0 1px 2px rgba(22,68,92,0.08);
  --shadow-2:0 4px 14px rgba(22,68,92,0.10),0 0 0 1px rgba(22,68,92,0.05);
  --shadow-3:0 20px 52px rgba(22,68,92,0.20),0 0 0 1px rgba(22,68,92,0.07);
  --shadow-focus:0 0 0 3px rgba(22,68,92,0.28);
}
/* ─── DARK: derived from Midnight Teal, not a generic near-black. ─── */
[data-theme="dark"]{
  --bg-app:#08202C;--bg-sidebar:#16445C;--bg-surface:#0C2A39;
  --bg-card:#103246;--bg-card-alt:#153D53;--bg-hover:#1B4C66;
  --bg-input:#0C2A39;
  --fg-strong:#FFFFFF;--fg-default:#DCE7ED;--fg-muted:#9CB3C0;--fg-subtle:#6E8899;
  --fg-on-navy:#FFFFFF;--fg-on-gold:#1A1A1A;--fg-on-sienna:#FFFFFF;
  --border-strong:#2C617E;--border-default:#1F4A63;--border-subtle:#183D53;
  --accent-gold:#E3B03B;--accent-gold-fill:#E3B03B;--accent-gold-soft:rgba(227,176,59,0.16);
  --status-red:#CE8058;--status-red-soft:rgba(154,78,42,0.30);
  --status-gold:#E3B03B;--status-gold-soft:rgba(227,176,59,0.17);
  --status-green:#8CC0A6;--status-green-soft:rgba(94,143,120,0.24);
  --status-blue:#8FBDD4;--status-blue-soft:rgba(143,189,212,0.16);
  --status-orange:#CE8058;--status-orange-soft:rgba(154,78,42,0.26);
  --status-purple:#E3B03B;--status-purple-soft:rgba(227,176,59,0.13);
  --status-teal:#8CC0A6;--status-teal-soft:rgba(94,143,120,0.18);
  --shadow-1:0 1px 2px rgba(0,0,0,0.34);
  --shadow-2:0 4px 14px rgba(0,0,0,0.38),0 0 0 1px rgba(255,255,255,0.04);
  --shadow-3:0 20px 52px rgba(0,0,0,0.56),0 0 0 1px rgba(255,255,255,0.05);
  --shadow-focus:0 0 0 3px rgba(227,176,59,0.34);
}
/* ─── Type ramp. DM Serif Text for display, Plus Jakarta Sans for everything else. ─── */
.page-title,.section-title,.modal-title,.stat-num,.empty-title,.brand-word,.serif{
  font-family:var(--font-serif);font-weight:400;letter-spacing:var(--track)}
html,body{height:100%;font-family:var(--font-sans);font-size:var(--text-md);letter-spacing:var(--track);color:var(--fg-default);background:var(--bg-app);overflow:hidden}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}
/* ══════════════════════════════════════════════════════════
   SHELL
══════════════════════════════════════════════════════════ */
#shell{display:flex;flex-direction:column;height:100vh}
#header{height:54px;background:var(--bg-card);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:200}
#body-wrap{display:flex;flex:1;overflow:hidden}
#sidebar{width:236px;background:var(--bg-surface);border-right:1px solid var(--border-default);overflow-y:auto;flex-shrink:0;padding:8px 0 40px;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding:26px 30px 60px;background:var(--bg-app)}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg-strong);text-decoration:none;flex-shrink:0}
.logo-mark{width:26px;height:30px;flex-shrink:0;color:var(--golden-ochre)}
.logo-mark svg{width:100%;height:100%;display:block}
.brand-word{font-size:15px;line-height:1;letter-spacing:.09em;color:var(--fg-strong);white-space:nowrap}
.brand-div{width:1px;height:18px;background:var(--border-strong);flex-shrink:0}
.brand-product{font-size:12px;font-weight:600;color:var(--fg-muted);letter-spacing:.02em;white-space:nowrap}
.env-badge{display:flex;align-items:center;gap:6px;background:var(--status-blue-soft);color:var(--status-blue);border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:3px 11px;font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.env-dot{width:6px;height:6px;border-radius:50%;background:var(--status-blue)}
.hdr-spacer{flex:1}
.hdr-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:6px 9px;cursor:pointer;font-size:var(--text-base);color:var(--fg-muted);position:relative;transition:all var(--dur-fast)}
.hdr-btn:hover{background:var(--bg-hover);color:var(--fg-strong)}
.notif-dot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--status-red);border-radius:50%;border:1.5px solid var(--bg-card)}
.role-option{padding:9px 14px;font-size:var(--text-base);cursor:pointer;color:var(--fg-default);display:flex;align-items:center;gap:8px}
.role-option:hover{background:var(--bg-hover)}
.role-option.active{background:var(--accent-gold-soft);color:var(--accent-gold);font-weight:700}
#mob-menu-btn{display:none}
@media(max-width:900px){
  #mob-menu-btn{display:block!important}
  .logo-text{display:none}
  #sidebar{display:none}
  #main{padding:16px 14px 90px}
  .hide-mob{display:none!important}
  #mobnav{display:flex!important}
}
/* ══════════════════════════════════════════════════════════
   SIDEBAR NAV
══════════════════════════════════════════════════════════ */
.nav-label{font-size:10px;font-weight:800;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.08em;padding:16px 18px 5px}
.nav-sec{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:14px 8px 3px;padding:6px 8px;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:10px;font-weight:800;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.08em;border-radius:var(--radius-sm);transition:all var(--dur-fast)}
.nav-sec:hover{background:var(--bg-hover);color:var(--fg-default)}
.nav-chev{display:inline-flex;transition:transform var(--dur-base) var(--ease);flex-shrink:0}
.nav-chev.open{transform:rotate(90deg)}
.nav-sec .nav-badge{margin-left:auto}
.nav-here{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--golden-ochre);flex-shrink:0}
.nav-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--fg-subtle);text-transform:none;letter-spacing:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;color:var(--fg-muted);font-size:var(--text-base);border-radius:var(--radius-md);margin:1px 8px;transition:all var(--dur-fast);border-left:3px solid transparent}
.nav-item:hover{background:var(--bg-hover);color:var(--fg-strong)}
.nav-item.active{background:var(--accent-gold-soft);color:var(--accent-gold);font-weight:700;border-left-color:var(--golden-ochre)}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--status-red);color:#fff;border-radius:var(--radius-pill);padding:1px 6px;font-size:10px;font-weight:800}
.nav-tag{margin-left:auto;background:var(--bg-card-alt);color:var(--fg-subtle);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:1px 6px;font-size:9px;font-weight:700;text-transform:uppercase}
#mobnav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--bg-card);border-top:1px solid var(--border-default);z-index:180;align-items:stretch}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--fg-subtle);cursor:pointer;border:none;background:transparent}
.mob-tab.active{color:var(--accent-gold)}
.mob-tab svg{width:19px;height:19px}
/* ══════════════════════════════════════════════════════════
   PAGE STRUCTURE
══════════════════════════════════════════════════════════ */
.page-header{margin-bottom:22px}
.page-title{font-size:var(--text-2xl);color:var(--fg-strong);line-height:1.15}
.page-sub{font-size:var(--text-md);color:var(--fg-muted);margin-top:5px;max-width:70ch}
.breadcrumb{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:var(--text-base);color:var(--fg-subtle);flex-wrap:wrap}
.bc-link{color:var(--status-blue);cursor:pointer;font-weight:600}
.bc-link:hover{text-decoration:underline}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;flex-wrap:wrap;gap:8px}
.section-title{font-size:var(--text-xl);color:var(--fg-strong)}
.section-note{font-size:var(--text-sm);color:var(--fg-muted)}
h4.sub-head{font-size:var(--text-base);font-weight:800;color:var(--fg-strong);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
/* ══════════════════════════════════════════════════════════
   CARDS / GRID
══════════════════════════════════════════════════════════ */
.card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:22px;margin-bottom:14px;box-shadow:var(--shadow-1)}
.card-flat{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:15px;margin-bottom:10px}
.card-alt{background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px}
.card:last-child,.card-flat:last-child{margin-bottom:0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.stat-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:15px;cursor:pointer;transition:all var(--dur-base) var(--ease)}
.stat-card:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.stat-card.active{border-color:var(--accent-gold);background:var(--accent-gold-soft)}
.stat-num{font-size:30px;color:var(--fg-strong);line-height:1}
.stat-label{font-size:var(--text-sm);color:var(--fg-muted);margin-top:6px;font-weight:600}
.stat-delta{font-size:var(--text-xs);margin-top:5px;font-weight:700}
.up{color:var(--status-green)}.down{color:var(--status-red)}
/* ══════════════════════════════════════════════════════════
   CHIPS / BADGES / MASTERY
══════════════════════════════════════════════════════════ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:700;white-space:nowrap;line-height:1.5}
.chip svg{width:12px;height:12px}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip-blue{background:var(--status-blue-soft);color:var(--status-blue)}
.chip-green{background:var(--status-green-soft);color:var(--status-green)}
.chip-gold{background:var(--status-gold-soft);color:var(--status-gold)}
.chip-red{background:var(--status-red-soft);color:var(--status-red)}
.chip-purple{background:var(--status-purple-soft);color:var(--status-purple)}
.chip-teal{background:var(--status-teal-soft);color:var(--status-teal)}
.chip-orange{background:var(--status-orange-soft);color:var(--status-orange)}
.chip-gray{background:var(--bg-card-alt);color:var(--fg-muted);border:1px solid var(--border-default)}
.tag-plan{display:inline-flex;align-items:center;gap:4px;background:var(--bg-card-alt);border:1px dashed var(--border-strong);color:var(--fg-subtle);border-radius:var(--radius-sm);padding:2px 7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tag-mvp{display:inline-flex;background:var(--status-green-soft);color:var(--status-green);border-radius:var(--radius-sm);padding:2px 7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tag-ai{display:inline-flex;align-items:center;gap:4px;background:var(--status-gold-soft);color:var(--status-gold);border:1px dashed var(--golden-ochre);border-radius:var(--radius-sm);padding:2px 7px;font-size:10px;font-weight:800;text-transform:uppercase}
.chip-purple{border:1px dashed currentColor}
/* ══════════════════════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-size:var(--text-base);font-weight:700;transition:all var(--dur-fast);font-family:inherit;line-height:1.2}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--accent-gold-fill);color:var(--fg-on-gold)}
.btn-primary:hover{background:#C39328}
.btn-teal{background:var(--midnight-teal);color:var(--fg-on-navy)}
.btn-teal:hover{background:#103850}
.btn-secondary{background:var(--bg-card-alt);color:var(--fg-default);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--bg-hover);color:var(--fg-strong)}
.btn-ghost{background:transparent;color:var(--fg-muted);border-color:var(--border-default)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--fg-strong)}
.btn-danger{background:var(--status-red-soft);color:var(--status-red);border-color:var(--status-red)}
.btn-danger:hover{background:var(--status-red);color:#fff}
.btn-sm{padding:6px 12px;font-size:var(--text-sm)}
.btn-xs{padding:4px 9px;font-size:var(--text-xs)}
.btn-lg{padding:12px 22px;font-size:var(--text-md)}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
/* ══════════════════════════════════════════════════════════
   PROGRESS / MASTERY
══════════════════════════════════════════════════════════ */
.bar{height:7px;background:var(--bg-card-alt);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--border-subtle)}
.bar-fill{height:100%;border-radius:var(--radius-pill);transition:width var(--dur-base)}
.bar-lg{height:11px}
.mastery{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-sm);font-weight:700}
.m-dots{display:inline-flex;gap:2px}
.m-dot{width:7px;height:7px;border-radius:2px;background:var(--border-strong)}
.ring{transform:rotate(-90deg)}
.why{background:var(--status-blue-soft);border-left:3px solid var(--status-blue);border-radius:var(--radius-sm);padding:11px 13px;font-size:var(--text-base);color:var(--fg-default);margin-top:10px;line-height:1.55}
.why b{color:var(--fg-strong)}
/* ══════════════════════════════════════════════════════════
   ALERTS / EMPTY / STATES
══════════════════════════════════════════════════════════ */
.alert{display:flex;gap:11px;padding:13px 15px;border-radius:var(--radius-lg);margin-bottom:14px;font-size:var(--text-base);line-height:1.55;border:1px solid}
.alert svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.alert-title{font-weight:800;color:var(--fg-strong);margin-bottom:3px;font-size:var(--text-md)}
.alert-info{background:var(--status-blue-soft);border-color:var(--status-blue);color:var(--fg-default)}
.alert-warn{background:var(--status-gold-soft);border-color:var(--status-gold);color:var(--fg-default)}
.alert-error{background:var(--status-red-soft);border-color:var(--status-red);color:var(--fg-default)}
.alert-ok{background:var(--status-green-soft);border-color:var(--status-green);color:var(--fg-default)}
.empty{text-align:center;padding:46px 20px;color:var(--fg-muted)}
.empty svg{width:40px;height:40px;opacity:.45;margin-bottom:12px}
.empty-title{font-size:var(--text-xl);color:var(--fg-strong);margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--bg-card-alt) 25%,var(--bg-hover) 50%,var(--bg-card-alt) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ══════════════════════════════════════════════════════════
   TABLES
══════════════════════════════════════════════════════════ */
.table-wrap{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--text-base)}
th{background:var(--bg-card-alt);text-align:left;padding:10px 14px;font-size:var(--text-xs);font-weight:800;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--border-default)}
td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);color:var(--fg-default);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background var(--dur-fast)}
tbody tr:hover{background:var(--bg-hover)}
.td-name{font-weight:700;color:var(--fg-strong)}
.avatar{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;border:1.5px solid}
/* ══════════════════════════════════════════════════════════
   FORMS
══════════════════════════════════════════════════════════ */
label.fl{display:block;font-size:var(--text-sm);font-weight:700;color:var(--fg-muted);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:9px 11px;color:var(--fg-default);font-size:var(--text-base);font-family:inherit;outline:none;transition:border-color var(--dur-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--accent-gold);box-shadow:var(--shadow-focus)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
.field{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.hint{font-size:var(--text-xs);color:var(--fg-subtle);margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-card);cursor:pointer;margin-bottom:8px;transition:all var(--dur-fast);font-size:var(--text-base);color:var(--fg-default)}
.opt:hover{border-color:var(--border-strong);background:var(--bg-hover)}
.opt.sel{border-color:var(--accent-gold);background:var(--accent-gold-soft);color:var(--fg-strong);font-weight:600}
.opt-check{width:18px;height:18px;border-radius:var(--radius-xs);border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.sel .opt-check{background:var(--accent-gold);border-color:var(--accent-gold);color:var(--fg-on-gold)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.toggle{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tslide{position:absolute;inset:0;background:var(--border-strong);border-radius:var(--radius-pill);transition:var(--dur-base);cursor:pointer}
.tslide:before{content:"";position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--dur-base)}
.toggle input:checked+.tslide{background:var(--accent-gold)}
.toggle input:checked+.tslide:before{transform:translateX(17px)}
.row-toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
.row-toggle:last-child{border-bottom:none}
.scale{display:flex;gap:7px;flex-wrap:wrap}
.scale-btn{flex:1;min-width:56px;padding:13px 8px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-card);cursor:pointer;text-align:center;font-size:var(--text-sm);color:var(--fg-muted);transition:all var(--dur-fast)}
.scale-btn:hover{border-color:var(--border-strong)}
.scale-btn.sel{border-color:var(--accent-gold);background:var(--accent-gold-soft);color:var(--fg-strong);font-weight:700}
.scale-num{display:block;font-size:var(--text-lg);font-weight:800;color:var(--fg-strong);margin-bottom:3px}
/* ══════════════════════════════════════════════════════════
   TABS / WIZARD / TIMELINE
══════════════════════════════════════════════════════════ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-default);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 15px;font-size:var(--text-base);font-weight:700;color:var(--fg-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;background:transparent;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--fg-strong)}
.tab.active{color:var(--accent-gold);border-bottom-color:var(--accent-gold)}
.steps{display:flex;gap:0;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;align-items:center;gap:8px;padding:0 16px 0 0;flex-shrink:0}
.step-num{width:25px;height:25px;border-radius:50%;background:var(--bg-card-alt);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:800;color:var(--fg-muted)}
.step.done .step-num{background:var(--status-green);border-color:var(--status-green);color:#fff}
.step.cur .step-num{background:var(--accent-gold);border-color:var(--accent-gold);color:var(--fg-on-gold)}
.step-lbl{font-size:var(--text-sm);color:var(--fg-muted);font-weight:600;white-space:nowrap}
.step.cur .step-lbl{color:var(--fg-strong);font-weight:800}
.prog-track{height:5px;background:var(--bg-card-alt);border-radius:var(--radius-pill);overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:var(--accent-gold);border-radius:var(--radius-pill);transition:width var(--dur-base)}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border-default)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--bg-app);border:2px solid var(--border-strong)}
.tl-dot.gold{border-color:var(--accent-gold);background:var(--accent-gold)}
.tl-dot.green{border-color:var(--status-green);background:var(--status-green)}
.tl-time{font-size:var(--text-xs);color:var(--fg-subtle);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tl-title{font-size:var(--text-base);font-weight:700;color:var(--fg-strong);margin:2px 0}
.tl-body{font-size:var(--text-sm);color:var(--fg-muted);line-height:1.55}
/* ══════════════════════════════════════════════════════════
   MODALS / TOAST / DRAWER
══════════════════════════════════════════════════════════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;overflow-y:auto}
.modal{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-2xl);box-shadow:var(--shadow-3);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;animation:pop var(--dur-base) var(--ease)}
.modal-wide{max-width:820px}
.modal-sm{max-width:410px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border-default);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-title{font-size:var(--text-xl);color:var(--fg-strong)}
.modal-sub{font-size:var(--text-base);color:var(--fg-muted);margin-top:3px}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border-default);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.x-btn{background:transparent;border:none;color:var(--fg-muted);cursor:pointer;padding:4px;border-radius:var(--radius-sm);flex-shrink:0}
.x-btn:hover{background:var(--bg-hover);color:var(--fg-strong)}
#toast-wrap{position:fixed;bottom:22px;right:22px;z-index:1000;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{background:var(--bg-card);border:1px solid var(--border-strong);border-left:3px solid var(--accent-gold);border-radius:var(--radius-md);padding:12px 15px;box-shadow:var(--shadow-3);display:flex;gap:10px;align-items:flex-start;font-size:var(--text-base);color:var(--fg-default);animation:slide var(--dur-base) var(--ease)}
.toast svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.ok{border-left-color:var(--status-green)}
.toast.err{border-left-color:var(--status-red)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:92vw;background:var(--bg-card);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-3);z-index:850;display:flex;flex-direction:column;animation:dr var(--dur-base) var(--ease)}
@keyframes dr{from{transform:translateX(100%)}to{transform:none}}
/* ══════════════════════════════════════════════════════════
   TUTOR PANEL / CHAT
══════════════════════════════════════════════════════════ */
.chat-wrap{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg-av{width:27px;height:27px;border-radius:var(--radius-sm);background:var(--accent-gold);color:var(--fg-on-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:11px}
.msg-av.me{background:var(--status-blue-soft);color:var(--status-blue);border:1px solid var(--status-blue)}
.msg-body{background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:11px 13px;font-size:var(--text-base);line-height:1.6;color:var(--fg-default);flex:1}
.msg.mine{flex-direction:row-reverse}
.msg.mine .msg-body{background:var(--status-blue-soft);border-color:var(--status-blue)}
.src{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 9px;background:var(--status-green-soft);color:var(--status-green);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:700;cursor:pointer}
.qa-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.qa{padding:6px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);background:var(--bg-card);color:var(--fg-muted);font-size:var(--text-sm);font-weight:600;cursor:pointer;transition:all var(--dur-fast);font-family:inherit}
.qa:hover{border-color:var(--accent-gold);color:var(--accent-gold);background:var(--accent-gold-soft)}
/* ══════════════════════════════════════════════════════════
   VOICE
══════════════════════════════════════════════════════════ */
.mic-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);background:var(--bg-card);color:var(--fg-muted);cursor:pointer;padding:8px 12px;font-family:inherit;font-size:var(--text-base);font-weight:700;transition:all var(--dur-fast)}
.mic-btn:hover{border-color:var(--golden-ochre);color:var(--accent-gold)}
.mic-btn.live{background:var(--status-red-soft);border-color:var(--status-red);color:var(--status-red)}
.mic-btn.live:before{content:"";position:absolute;inset:-4px;border-radius:var(--radius-pill);border:2px solid var(--status-red);opacity:.5;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.96);opacity:.55}100%{transform:scale(1.14);opacity:0}}
.levels{display:inline-flex;align-items:flex-end;gap:2px;height:15px}
.levels i{display:block;width:3px;background:currentColor;border-radius:2px;animation:lv .9s ease-in-out infinite}
.levels i:nth-child(1){animation-delay:0s}.levels i:nth-child(2){animation-delay:.12s}.levels i:nth-child(3){animation-delay:.24s}
.levels i:nth-child(4){animation-delay:.36s}.levels i:nth-child(5){animation-delay:.48s}
@keyframes lv{0%,100%{height:4px}50%{height:15px}}
.spk-btn{background:transparent;border:none;color:var(--fg-subtle);cursor:pointer;padding:3px;border-radius:var(--radius-xs);display:inline-flex}
.spk-btn:hover{background:var(--bg-hover);color:var(--accent-gold)}
.spk-btn.on{color:var(--accent-gold)}
.reading{background:var(--accent-gold-soft);border-radius:var(--radius-xs);box-shadow:0 0 0 3px var(--accent-gold-soft)}
#hf{position:fixed;inset:0;z-index:940;background:var(--bg-sidebar);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff}
.orb{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:26px;position:relative;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);color:#fff;transition:all var(--dur-base)}
.orb.listen{border-color:var(--golden-ochre);background:rgba(227,176,59,.16);color:var(--golden-ochre)}
.orb.speak{border-color:#8CC0A6;background:rgba(140,192,166,.16);color:#8CC0A6}
.orb.think{border-color:rgba(255,255,255,.5)}
.orb:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid currentColor;opacity:0}
.orb.listen:before{animation:pulse 1.8s ease-out infinite;opacity:.5}
.hf-state{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--golden-ochre);margin-bottom:12px}
.hf-text{font-family:var(--font-serif);font-size:23px;line-height:1.42;max-width:26ch;color:#fff;min-height:2.6em}
.hf-sub{font-size:13px;color:rgba(255,255,255,.62);margin-top:16px;max-width:44ch;line-height:1.6}
[data-reduce-motion="true"] .orb:before,[data-reduce-motion="true"] .mic-btn.live:before,[data-reduce-motion="true"] .levels i{animation:none!important}
/* ══════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════ */
.flex{display:flex}.ic{align-items:center}.jb{justify-content:space-between}.wrap{flex-wrap:wrap}.col{flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.f1{flex:1}.tar{text-align:right}.tac{text-align:center}
.fs11{font-size:11px}.fs12{font-size:12px}.fs13{font-size:13px}.fs15{font-size:15px}.fs18{font-size:18px}
.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}
.muted{color:var(--fg-muted)}.subtle{color:var(--fg-subtle)}.strong{color:var(--fg-strong)}
.lh16{line-height:1.6}
.divider{height:1px;background:var(--border-subtle);margin:16px 0}
.click{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[data-reduce-motion="true"] *{animation:none!important;transition:none!important}
[data-dyslexia="true"] body,[data-dyslexia="true"] #main{letter-spacing:.04em;word-spacing:.12em;line-height:1.85}
</style>

  btn.querySelector('.nav-chev')&&btn.querySelector('.nav-chev').classList.toggle('open',!open);
}
function nav(view,data){
  stopAllVideos();
  if(!VOICE.handsFree){ stopSpeaking(); stopListening(); }
  if(data!==undefined) S.selected = data;
  S.view = view;
  closeModal(); closeMobileNav();
  renderSidebar(); renderMobNav(); renderMain();
  var m=document.getElementById('main'); if(m) m.scrollTop=0;
}
function navGroups(){
  var items=ROLE_NAV[S.role]||[], groups=[], cur={label:null,items:[],collapsible:false};
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.section){
      if(cur.items.length||cur.label) groups.push(cur);
      cur={label:it.label,items:[],collapsible:groups.length>0};
    } else cur.items.push(it);
  }
  if(cur.items.length||cur.label) groups.push(cur);
  return groups;
}
function groupState(g){
  var badge=0, active=false;
  for(var i=0;i<g.items.length;i++){
    if(g.items[i].badge) badge += (parseInt(g.items[i].badge,10)||0);
    if(g.items[i].v===S.view) active=true;
  }
  var open;
  if(!g.collapsible) open=true;
  else if(S.navTouched[g.label]) open=!!S.navOpen[g.label];
  else open=(badge>0||active);
  return {badge:badge,active:active,open:open};
}
function toggleNavSection(label){
  var groups=navGroups();
  for(var i=0;i<groups.length;i++){
    if(groups[i].label===label){
      var st=groupState(groups[i]);
      S.navTouched[label]=true; S.navOpen[label]=!st.open;
      break;
    }
  }
  renderSidebar();
}
function renderSidebar(){
  var sb=document.getElementById('sidebar');
  var groups=navGroups(), h='';
  for(var gi=0;gi<groups.length;gi++){
    var g=groups[gi], st=groupState(g);
    if(g.collapsible){
      h+='<button class="nav-sec" type="button" aria-expanded="'+st.open+'" aria-controls="navgrp-'+gi+'" '
        + 'title="'+(st.open?'Hide':'Show')+' '+g.label.toLowerCase()+'" onclick="toggleNavSection(\''+g.label+'\')">'
        + '<span class="nav-chev'+(st.open?' open':'')+'">'+icon('chev',12,2.6)+'</span><span>'+g.label+'</span>'
        + (!st.open&&st.badge?'<span class="nav-badge">'+st.badge+'</span>'
           : (!st.open&&st.active?'<span class="nav-here" title="You are here"></span>'
           : (!st.open?'<span class="nav-count">'+g.items.length+'</span>':'')))
        + '</button>';
    } else if(g.label){ h+='<div class="nav-label">'+g.label+'</div>'; }
    h+='<div id="navgrp-'+gi+'"'+(st.open?'':' hidden')+'>';
    if(st.open){
      for(var i=0;i<g.items.length;i++){
        var it=g.items[i];
        h+='<div class="nav-item'+(S.view===it.v?' active':'')+'" role="button" tabindex="0" onclick="nav(\''+it.v+'\')" onkeypress="if(event.key===\'Enter\')nav(\''+it.v+'\')">'
          + icon(it.i,17,1.8) + '<span>'+it.l+'</span>'
          + (it.badge?'<span class="nav-badge">'+it.badge+'</span>':'') + '</div>';
      }
    }
    h+='</div>';
  }
  sb.innerHTML=h;
}
function renderMobNav(){
  var mn=document.getElementById('mobnav');
  var items=MOB_NAV[S.role]||[]; var h='';

function toast(msg,kind){

  d.className='toast '+(kind||'');
  var isErr = (kind==='err');
  d.innerHTML = icon(isErr?'alert':kind==='ok'?'check':'info',16,2)+'<div class="f1">'+msg+'</div>'
    + (isErr?'<button class="x-btn" style="margin-left:8px;flex-shrink:0" onclick="this.parentNode.style.opacity=\'0\';var el=this.parentNode;setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},250)" aria-label="Dismiss">'+icon('x',14,2)+'</button>':'');
  w.appendChild(d);

  }
}

var ONB = [
  {t:'Welcome', k:'welcome'},

  {t:'Your goals', k:'goals'},
  {t:'Available time', k:'time'},

  {t:'Where to start', k:'baseline'},
  {t:'How it is explained', k:'format'},
  {t:'How you like help', k:'support'},
  {t:'Pace and challenge', k:'pace'},
  {t:'Memory and review', k:'memory'},
  {t:'When it gets hard', k:'frustration'},
  {t:'Progress feedback', k:'motivation'},
  {t:'Accessibility', k:'a11y'},
  {t:'Tutor style', k:'style'},
  {t:'Your profile', k:'summary'}
];
function startOnboarding(){ S.onbStep=0; closeModal(); nav('onboarding'); }
function onbNext(){ if(S.onbStep<ONB.length-1){ S.onbStep++; renderMain(); } }
function onbBack(){ if(S.onbStep>0){ S.onbStep--; renderMain(); } }
function pickOpt(el,multi){
  if(!multi){ var sibs=el.parentNode.querySelectorAll('.opt'); for(var i=0;i<sibs.length;i++) sibs[i].classList.remove('sel'); }
  el.classList.toggle('sel');
}
function optList(items,multi){
  return '<div class="'+(items.length>6?'opt-grid':'')+'">'+items.map(function(o){
    return '<div class="opt" onclick="pickOpt(this,'+(multi?'true':'false')+')"><div class="opt-check">'+icon('check',12,3)+'</div><span class="f1">'+o+'</span></div>'; }).join('')+'</div>';
}

function filterTable(q,id){
  var body=document.getElementById(id); if(!body) return;
  var rows=body.querySelectorAll('tr'); q=(q||'').toLowerCase();

    rows[i].style.display = s.indexOf(q)>-1 ? '' : 'none';
  }
}

/* ══════════════════════════════════════════════════════════
   VOICE ENGINE
   Real Web Speech APIs where the browser supports them.
   Scripted fallback everywhere else so a demo never dies.
══════════════════════════════════════════════════════════ */
var VOICE = {
  ttsOK: (typeof window!=='undefined' && 'speechSynthesis' in window),
  sttOK: (typeof window!=='undefined' && !!(window.SpeechRecognition||window.webkitSpeechRecognition)),
  on:true, autoRead:false, rate:1, voiceName:null,
  speaking:false, listening:false, handsFree:false,
  micState:'ready', rec:null, queue:[], qi:0, onDone:null, hfPhase:'idle', hfText:'', simTimer:null
};
var SIM_PHRASES = [
  'Why does the chain stop without sterility?',
  'Can you say that a simpler way?',
  'Show me a video about this',
  'I think the answer is the cytoplasm',
  'Quiz me on this section'
];
var SIM_I = 0;
function voiceSupported(){ return VOICE.ttsOK || VOICE.sttOK; }
function listVoices(){
  if(!VOICE.ttsOK) return [];
  try{ return window.speechSynthesis.getVoices()||[]; }catch(e){ return []; }
}
function pickVoice(){
  var vs=listVoices(); if(!vs.length) return null;
  if(VOICE.voiceName){ for(var i=0;i<vs.length;i++){ if(vs[i].name===VOICE.voiceName) return vs[i]; } }
  for(var j=0;j<vs.length;j++){ if((vs[j].lang||'').indexOf('en')===0) return vs[j]; }
  return vs[0];
}
function splitSentences(t){
  var parts=String(t).replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[String(t)];
  return parts.map(function(x){ return x.trim(); }).filter(Boolean);
}
function stopSpeaking(){
  VOICE.speaking=false; VOICE.queue=[]; VOICE.onDone=null;
  if(VOICE.simTimer){ clearTimeout(VOICE.simTimer); VOICE.simTimer=null; }
  if(VOICE.ttsOK){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  paintSpeakButtons();
}
function speak(text,onDone,onSentence){
  if(!VOICE.on){ if(onDone) onDone(); return; }
  stopSpeaking();
  VOICE.queue=splitSentences(text); VOICE.qi=0; VOICE.speaking=true; VOICE.onDone=onDone;
  paintSpeakButtons();
  var step=function(){
    if(!VOICE.speaking) return;
    if(VOICE.qi>=VOICE.queue.length){ VOICE.speaking=false; paintSpeakButtons(); if(onDone) onDone(); return; }
    if(onSentence) onSentence(VOICE.qi);
    var line=VOICE.queue[VOICE.qi];
    if(VOICE.ttsOK){
      try{
        var u=new window.SpeechSynthesisUtterance(line);
        u.rate=VOICE.rate; var v=pickVoice(); if(v) u.voice=v;
        u.onend=function(){ VOICE.qi++; step(); };
        u.onerror=function(){ VOICE.qi++; step(); };
        window.speechSynthesis.speak(u);
        return;
      }catch(e){}
    }
    VOICE.simTimer=setTimeout(function(){ VOICE.qi++; step(); }, Math.min(4200, 340+line.length*42));
  };
  step();
}
function paintSpeakButtons(){
  var els=document.querySelectorAll('.spk-btn');
  for(var i=0;i<els.length;i++){
    els[i].classList.toggle('on', VOICE.speaking);
    els[i].innerHTML = icon(VOICE.speaking?'stop':'speaker',15,2);
  }
  var hf=document.getElementById('hf'); if(hf) renderHandsFree();
}
function speakToggle(text){ if(VOICE.speaking) stopSpeaking(); else speak(text); }
function startListening(onResult,onInterim){
  if(!VOICE.on){ toast('Voice is switched off. Turn it on under Accessibility.','err'); return; }
  VOICE.listening=true; VOICE.micState='listening'; paintMic();
  if(VOICE.sttOK){
    try{
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      VOICE.rec=new SR();
      VOICE.rec.lang='en-US'; VOICE.rec.interimResults=true; VOICE.rec.continuous=false;
      var finalTxt='';
      VOICE.rec.onresult=function(e){
        var interim='';
        for(var i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal) finalTxt+=e.results[i][0].transcript;
          else interim+=e.results[i][0].transcript;
        }
        if(onInterim) onInterim(finalTxt+interim);
      };
      VOICE.rec.onerror=function(e){
        VOICE.listening=false;
        VOICE.micState = (e && (e.error==='not-allowed'||e.error==='service-not-allowed')) ? 'denied'
                       : (e && e.error==='no-speech') ? 'nospeech' : 'error';
        paintMic(); micProblem();
      };
      VOICE.rec.onend=function(){
        VOICE.listening=false;
        if(VOICE.micState==='listening'){ VOICE.micState='ready'; paintMic(); if(finalTxt.trim()&&onResult) onResult(finalTxt.trim()); else micProblem('nospeech'); }
      };
      VOICE.rec.start();
      return;
    }catch(e){}
  }
  var phrase=SIM_PHRASES[SIM_I % SIM_PHRASES.length]; SIM_I++;
  var shown='', n=0;
  var tick=function(){
    if(!VOICE.listening) return;
    n+=2; shown=phrase.slice(0,n);
    if(onInterim) onInterim(shown);
    if(n<phrase.length){ VOICE.simTimer=setTimeout(tick,40); }
    else { VOICE.listening=false; VOICE.micState='ready'; paintMic(); if(onResult) onResult(phrase); }
  };
  VOICE.simTimer=setTimeout(tick,500);
}
function stopListening(){
  VOICE.listening=false;
  if(VOICE.simTimer){ clearTimeout(VOICE.simTimer); VOICE.simTimer=null; }
  if(VOICE.rec){ try{ VOICE.rec.stop(); }catch(e){} }
  VOICE.micState='ready'; paintMic();
}
function paintMic(){
  var els=document.querySelectorAll('.mic-btn');
  for(var i=0;i<els.length;i++){
    var live=VOICE.listening;
    els[i].classList.toggle('live',live);
    var lbl=els[i].getAttribute('data-label');
    els[i].innerHTML = (live ? '<span class="levels"><i></i><i></i><i></i><i></i><i></i></span>' : icon('mic',15,2)) + (lbl?'<span>'+(live?'Listening':lbl)+'</span>':'');
  }
  var hf=document.getElementById('hf'); if(hf) renderHandsFree();
}
function micProblem(force){
  var st=force||VOICE.micState;
  if(st==='denied'){
    openModal('Microphone blocked',null,
      alertBox('error',null,'<b>What happened:</b> Your browser refused microphone access.<br><b>Why:</b> Permission was denied for this page, or the page is not on a secure connection.<br><b>What you can do:</b> Allow the microphone in your browser settings, or keep typing. Nothing about your learning depends on voice.'),
      '<button class="btn btn-ghost" onclick="closeModal();nav(\'student-accessibility\')">Voice settings</button><button class="btn btn-primary" onclick="closeModal()">Keep typing</button>','modal-sm');
  } else if(st==='nospeech'){
    toast('I did not catch anything. Tap the microphone and try again.','err');
  } else if(st==='error'){
    toast('The microphone stopped unexpectedly. You can type instead.','err');
  }
}
/* ── Hands-free conversation mode ────────────────────────── */
function openHandsFree(){
  VOICE.handsFree=true; VOICE.hfPhase='greet'; VOICE.hfText='';
  renderHandsFree();
  var greet='Hands free is on. Ask me anything about this lesson, and I will only answer from what Dr. Ruiz approved.';
  VOICE.hfText=greet;
  renderHandsFree();
  speak(greet,function(){ hfListen(); });
}
function hfListen(){
  if(!VOICE.handsFree) return;
  VOICE.hfPhase='listening'; VOICE.hfText=''; renderHandsFree();
  startListening(function(txt){
    if(!VOICE.handsFree) return;
    VOICE.hfPhase='thinking'; VOICE.hfText=txt; renderHandsFree();
    setTimeout(function(){
      if(!VOICE.handsFree) return;
      tutorAsk(txt,true);
      var last=S.tutorMsgs[S.tutorMsgs.length-1];
      var reply=last?last.t:'Let me work from the approved material.';
      VOICE.hfPhase='speaking'; VOICE.hfText=reply; renderHandsFree();
      speak(reply,function(){ hfListen(); });
    },700);
  },function(partial){
    if(VOICE.hfPhase==='listening'){ VOICE.hfText=partial; renderHandsFree(); }
  });
}
function closeHandsFree(){
  VOICE.handsFree=false; VOICE.hfPhase='idle';
  stopListening(); stopSpeaking();
  document.getElementById('voice-wrap').innerHTML='';
  renderMain();
  toast('Hands free ended. The transcript was saved to your tutor history.','ok');
}
function hfInterrupt(){
  if(VOICE.speaking){ stopSpeaking(); hfListen(); }
  else if(VOICE.listening){ stopListening(); VOICE.hfPhase='paused'; renderHandsFree(); }
  else { hfListen(); }
}
function renderHandsFree(){
  if(!VOICE.handsFree){ return; }
  var ph=VOICE.hfPhase;
  var cls = ph==='listening'?'listen':ph==='speaking'||ph==='greet'?'speak':ph==='thinking'?'think':'';
  var label = ph==='listening'?'Listening':ph==='thinking'?'Thinking':ph==='paused'?'Paused':'Speaking';
  var ic = ph==='listening'?'mic':ph==='thinking'?'refresh':'speaker';
  var body = VOICE.hfText || (ph==='listening'?'Go ahead, I am listening.':'');
  document.getElementById('voice-wrap').innerHTML =
    '<div id="hf" role="dialog" aria-modal="true" aria-label="Hands free tutor">'
    + '<div class="orb '+cls+'">'+icon(ic,50,1.4)+'</div>'
    + '<div class="hf-state">'+label+'</div>'
    + '<div class="hf-text">'+body+'</div>'
    + '<div class="hf-sub">'+(VOICE.sttOK?'Speak naturally. Tap the button to interrupt me at any time.':'This browser does not support speech recognition, so the microphone is simulated. Everything else is real.')+'</div>'
    + '<div class="btn-row mt24" style="justify-content:center">'
      + '<button class="btn btn-primary" onclick="hfInterrupt()">'+icon(VOICE.speaking?'stop':'mic',15,2)+(VOICE.speaking?'Interrupt':VOICE.listening?'Stop':'Speak')+'</button>'
      + '<button class="btn btn-secondary" onclick="closeHandsFree()">End session</button></div>'
    + '<div class="hf-sub" style="margin-top:22px">Your audio is transcribed and discarded. Only the text is kept.</div></div>';
}

var VIDEO_TIMERS = {};
function fmtTime(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60); var r=s%60; return m+':'+(r<10?'0':'')+r; }
function stopAllVideos(){ for(var k in VIDEO_TIMERS){ clearInterval(VIDEO_TIMERS[k]); } VIDEO_TIMERS={}; }
function togglePlay(vid,dur,start){
  var bar=document.getElementById('vp-bar-'+vid), lbl=document.getElementById('vp-time-'+vid), btn=document.getElementById('vp-btn-'+vid), ov=document.getElementById('vp-ov-'+vid);
  if(!bar) return;
  if(VIDEO_TIMERS[vid]){ clearInterval(VIDEO_TIMERS[vid]); delete VIDEO_TIMERS[vid]; btn.innerHTML=icon('play',15,2)+'Play'; if(ov) ov.style.display='flex'; return; }
  if(parseFloat(bar.getAttribute('data-t')||'0')===0 && start) bar.setAttribute('data-t',start);
  btn.innerHTML=icon('pause',15,2)+'Pause'; if(ov) ov.style.display='none';
  VIDEO_TIMERS[vid]=setInterval(function(){
    var cur=parseFloat(bar.getAttribute('data-t')||'0')+2;
    if(cur>=dur){ cur=dur; clearInterval(VIDEO_TIMERS[vid]); delete VIDEO_TIMERS[vid]; btn.innerHTML=icon('refresh',15,2)+'Replay'; bar.setAttribute('data-t',0); if(ov) ov.style.display='flex'; }
    else bar.setAttribute('data-t',cur);
    bar.style.width=(cur/dur*100)+'%';
    lbl.textContent=fmtTime(cur)+' / '+fmtTime(dur);
  },200);
}
function seekSegment(vid,dur,start){
  var bar=document.getElementById('vp-bar-'+vid), lbl=document.getElementById('vp-time-'+vid);
  if(!bar) return;
  bar.setAttribute('data-t',start); bar.style.width=(start/dur*100)+'%';
  lbl.textContent=fmtTime(start)+' / '+fmtTime(dur);
  toast('Jumped to the assigned segment at '+fmtTime(start)+'.');
}
